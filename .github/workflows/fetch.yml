name: fetch
on:
  push:
    branches: [tmp-rb7-photos2]
permissions:
  contents: write
jobs:
  f:
    if: "!contains(github.event.head_commit.message, 'photos')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p photos
          while read pid url; do curl -sfL --retry 5 --retry-all-errors -o "photos/$pid" "$url" || echo "fail $pid"; done < photos.txt
          pip install -q pillow && python shrink.py
          git config user.name bot; git config user.email bot@x
          git add photos && git commit -qm photos && git push
