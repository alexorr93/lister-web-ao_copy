# Adds what's needed for Playwright's headless Chromium to actually run --
# this is an attempt at getting a REAL browser (real JS engine, not `requests`)
# past BidSpotter's AWS WAF challenge, which nothing server-side has cleared so
# far. The nix packages below are Chromium's runtime shared-library
# dependencies (no apt/sudo available in this build environment, so these come
# from nix instead of `playwright install --with-deps`, which shells out to
# apt-get and won't work here).

[phases.setup]
nixPkgs = [
  "python311",
  "chromium",
  "nss",
  "atk",
  "at-spi2-atk",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "alsa-lib",
  "cairo",
  "pango",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -m playwright install chromium",
]
