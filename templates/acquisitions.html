<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Acquisitions — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root {
  --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a; --red: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-logo { font-weight: 800; font-size: 15px; color: var(--text); margin-right: 8px; white-space: nowrap; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-btn.active { color: #fff; background: var(--accent); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.main { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; }
@media (max-width: 1100px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }
.field-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: #1e2535; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { color: var(--red); border-color: #7f1d1d; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
.lot { font-weight: 700; font-family: monospace; }
.muted { color: var(--muted); }
.pos { color: var(--green); font-weight: 700; }
.neg { color: var(--red); font-weight: 700; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.status-msg { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">📦 Lister AI</div>
  <a class="nav-btn" href="/">📊 Dashboard</a>
  <a class="nav-btn" href="/categories">📂 Categories</a>
  <a class="nav-btn" href="/archive">🗄️ Archive</a>
  <a class="nav-btn" href="/financials">💰 Financials</a>
  <a class="nav-btn active" href="/acquisitions">🛒 Acquisitions</a>
  <div class="nav-spacer"></div>
  <a class="nav-download" href="/logout" style="color:#ef4444;border-color:#7f1d1d;">⏻ Logout</a>
</nav>

<div class="main">
  <h1>Acquisitions</h1>
  <div class="sub">What you bought, matched against live profit per lot (from synced eBay/Shopify orders).</div>

  <div class="card">
    <div class="form-grid">
      <div>
        <div class="field-label">Lot Name</div>
        <input type="text" class="field-input" id="new-lot" placeholder="e.g. RJ"/>
      </div>
      <div>
        <div class="field-label">Date</div>
        <input type="date" class="field-input" id="new-date"/>
      </div>
      <div>
        <div class="field-label">Price</div>
        <input type="number" step="0.01" class="field-input" id="new-price" placeholder="0.00"/>
      </div>
      <div>
        <div class="field-label">Payment Method</div>
        <input type="text" class="field-input" id="new-payment" placeholder="cash, venmo..."/>
      </div>
      <div>
        <div class="field-label">Name / Source</div>
        <input type="text" class="field-input" id="new-name" placeholder="who / where"/>
      </div>
      <button class="btn btn-primary" onclick="addAcquisition()">+ Add Row</button>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:10px;">
      <div>
        <div class="field-label">Import Spreadsheet (CSV)</div>
        <input type="file" id="csv-file-input" accept=".csv" style="font-size:12px;" onchange="uploadCsv()"/>
      </div>
      <span id="upload-status" class="status-msg"></span>
    </div>
  </div>

  <div id="table-area"><div class="empty">Loading...</div></div>
</div>

<script>
let acquisitions = [];

function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadAcquisitions() {
  const r = await fetch('/api/acquisitions');
  const data = await r.json();
  acquisitions = data.acquisitions || [];
  renderTable();
}

function renderTable() {
  if (!acquisitions.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">No acquisitions yet — add one above or import a CSV.</div>';
    return;
  }
  let html = `<table><thead><tr>
    <th>Lot</th><th>Date</th><th>Cost</th><th>Payment</th><th>Name/Source</th>
    <th>Live Net Profit</th><th>ROI</th><th>Historical Profit (ref)</th><th></th>
  </tr></thead><tbody>`;
  for (const a of acquisitions) {
    const roiClass = a.roi_pct == null ? '' : (a.roi_pct >= 0 ? 'pos' : 'neg');
    const profitClass = a.net_profit >= 0 ? 'pos' : 'neg';
    html += `<tr>
      <td class="lot">${escapeHtml(a.lot_name)}</td>
      <td class="muted">${escapeHtml(a.purchase_date || '')}</td>
      <td>${fmtMoney(a.price)}</td>
      <td class="muted">${escapeHtml(a.payment_method || '')}</td>
      <td class="muted">${escapeHtml(a.seller_name || '')}</td>
      <td class="${profitClass}">${fmtMoney(a.net_profit)}</td>
      <td class="${roiClass}">${a.roi_pct == null ? '—' : a.roi_pct + '%'}</td>
      <td class="muted">${fmtMoney(a.historical_profit)}</td>
      <td><button class="btn btn-danger" style="padding:4px 10px;font-size:11px;" onclick="deleteAcquisition('${a.id}')">Delete</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('table-area').innerHTML = html;
}

async function addAcquisition() {
  const lot = document.getElementById('new-lot').value.trim();
  if (!lot) { alert('Lot name is required'); return; }
  const body = {
    lot_name: lot,
    purchase_date: document.getElementById('new-date').value || null,
    price: parseFloat(document.getElementById('new-price').value) || null,
    payment_method: document.getElementById('new-payment').value.trim() || null,
    seller_name: document.getElementById('new-name').value.trim() || null,
  };
  const r = await fetch('/api/acquisitions', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  if (!r.ok) { alert('Failed to add'); return; }
  document.getElementById('new-lot').value = '';
  document.getElementById('new-date').value = '';
  document.getElementById('new-price').value = '';
  document.getElementById('new-payment').value = '';
  document.getElementById('new-name').value = '';
  loadAcquisitions();
}

async function deleteAcquisition(id) {
  if (!confirm('Delete this acquisition row?')) return;
  await fetch('/api/acquisitions/' + id, {method: 'DELETE'});
  loadAcquisitions();
}

async function uploadCsv() {
  const input = document.getElementById('csv-file-input');
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  document.getElementById('upload-status').textContent = 'Uploading...';
  try {
    const r = await fetch('/api/acquisitions/upload-csv', {method: 'POST', body: fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Upload failed');
    document.getElementById('upload-status').textContent = `✅ Imported ${data.inserted} row(s)${data.skipped ? ', ' + data.skipped + ' skipped' : ''}.`;
    loadAcquisitions();
  } catch(e) {
    document.getElementById('upload-status').textContent = `❌ ${e.message}`;
  }
  input.value = '';
}

loadAcquisitions();
</script>
</body>
</html>
