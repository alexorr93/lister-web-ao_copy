<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Analytics — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; max-width: 900px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.status-msg { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
a { color: #60a5fa; }
#tooltip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s; background: #161b29; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; z-index: 10; min-width: 170px; }
#legend-wrap { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; padding: 0 4px; flex-wrap: wrap; gap: 16px; }
#size-legend { display: flex; align-items: flex-end; gap: 10px; }
.legend-label { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.legend-note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
{% include "_nav.html" %}

<div class="main">
  <h1>📊 Analytics</h1>
  <div class="sub">Where auctions are actually happening, sized by lot count.</div>

  <div class="card">
    <div id="map-status" class="status-msg">Loading auction data…</div>
    <div id="map"></div>
    <div id="legend-wrap" style="display:none;">
      <div style="display:flex;align-items:flex-end;gap:14px;">
        <span class="legend-label">Lots per auction</span>
        <div id="size-legend"></div>
      </div>
      <div class="legend-note" id="legend-note"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
async function loadMap() {
  const statusEl = document.getElementById('map-status');
  let points;
  try {
    const res = await fetch('/api/analytics/auction-map');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    points = data.points || [];
  } catch (e) {
    statusEl.textContent = 'Could not load auction data: ' + e.message;
    return;
  }

  if (points.length === 0) {
    statusEl.textContent = 'No auctions with lots yet.';
    return;
  }

  // jitter exact-duplicate coordinates (multiple auctions from the same zip)
  const seen = {};
  points.forEach(p => {
    const key = p.lat + ',' + p.lng;
    seen[key] = (seen[key] || 0);
    const n = seen[key]++;
    if (n > 0) {
      const angle = n * 2.4;
      const r = 0.18 * Math.ceil(n / 1);
      p.lat += r * Math.cos(angle);
      p.lng += r * Math.sin(angle);
    }
  });

  const approxCount = points.filter(p => p.approx).length;
  statusEl.textContent = `${points.length} auctions plotted` + (approxCount ? ` (${approxCount} estimated by state -- no zip on file)` : '');
  document.getElementById('legend-wrap').style.display = 'flex';
  document.getElementById('legend-note').textContent =
    `${points.length} auctions · hollow ring = state-level estimate (no zip on file)`;

  const maxLots = Math.max(...points.map(d => d.l));
  const rScale = d3.scaleSqrt([0, maxLots], [2.5, 22]);
  const warmRamp = ["#FAEEDA", "#FAC775", "#EF9F27", "#E85D24", "#B03A17"];
  const colorScale = d3.scaleQuantize([0, maxLots], warmRamp);

  const svg = d3.select('#map').append('svg')
    .attr('viewBox', '0 0 975 610').attr('width', '100%')
    .attr('role', 'img').attr('aria-label', 'US map with auctions plotted by zip code, sized and colored by lot count');
  const g = svg.append('g');
  const projection = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);
  const path = d3.geoPath(projection);
  const tooltip = d3.select('#tooltip');

  const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json');
  const states = topojson.feature(us, us.objects.states).features;

  g.selectAll('path.state').data(states).join('path')
    .attr('d', path)
    .attr('fill', '#242422')
    .attr('stroke', '#3a3a37')
    .attr('stroke-width', 0.75);

  const order = points.slice().sort((a, b) => a.l - b.l);

  g.selectAll('circle.bubble').data(order).join('circle')
    .attr('cx', d => { const c = projection([d.lng, d.lat]); return c ? c[0] : -100; })
    .attr('cy', d => { const c = projection([d.lng, d.lat]); return c ? c[1] : -100; })
    .attr('r', d => rScale(d.l))
    .attr('fill', d => d.approx ? 'none' : colorScale(d.l))
    .attr('fill-opacity', 0.8)
    .attr('stroke', d => d.approx ? colorScale(d.l) : 'rgba(0,0,0,.35)')
    .attr('stroke-width', d => d.approx ? 1.5 : 1)
    .attr('stroke-dasharray', d => d.approx ? '2,2' : null)
    .style('cursor', 'pointer')
    .on('mousemove', (event, d) => {
      tooltip.style('opacity', 1)
        .style('left', (event.clientX + 14) + 'px')
        .style('top', (event.clientY - 10) + 'px')
        .html(`<div style="font-weight:600;margin-bottom:4px;color:#f1f5f9;">${d.a}</div>
               <div style="color:#94a3b8;">Lots: <span style="color:#f1f5f9;font-weight:600;">${d.l.toLocaleString()}</span></div>
               <div style="color:#94a3b8;">State: <span style="color:#f1f5f9;font-weight:600;">${d.s}</span></div>
               ${d.approx ? '<div style="color:#64748b;margin-top:4px;">approximate — no zip on file</div>' : ''}`);
    })
    .on('mouseleave', () => tooltip.style('opacity', 0));

  const legendVals = [10, 100, Math.round(maxLots)];
  const legend = d3.select('#size-legend');
  legendVals.forEach(v => {
    const r = rScale(v);
    const item = legend.append('div').style('display', 'flex').style('flex-direction', 'column').style('align-items', 'center').style('gap', '4px');
    item.append('svg').attr('width', 56).attr('height', 56)
      .append('circle').attr('cx', 28).attr('cy', 52 - r).attr('r', r)
      .attr('fill', colorScale(v)).attr('fill-opacity', 0.8)
      .attr('stroke', 'rgba(0,0,0,.35)').attr('stroke-width', 1);
    item.append('span').style('font-size', '11px').style('color', 'var(--muted)').text(v.toLocaleString());
  });
}
loadMap();
</script>
</body>
</html>
