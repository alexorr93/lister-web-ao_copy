<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auction Monitor — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a; --red: #dc2626; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; overflow-x: auto; }
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; max-width: 900px; word-wrap: break-word; }
.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: #1e2535; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--accent); border-color: var(--accent); }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { background: #161b29; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: none; }
.muted { color: var(--muted); }
.status-msg { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
a { color: #60a5fa; }
</style>
</head>
<body>
{% include "_nav.html" %}

<div class="main">
  <h1>Auction Monitor</h1>
  <div class="sub">Tracked BidSpotter auction catalogs — title, end date, location, and lot count. Lot Count is a real number but currently an estimate (summed from category tags on the list page, not the exact per-catalog total).</div>

  <div class="filter-bar">
    <button class="btn btn-primary" onclick="scanNow()">🔎 Scan for Catalogs</button>
    <input type="text" class="field-input" id="search-input" placeholder="Search title/auctioneer..." oninput="renderTable()" style="width:260px;"/>
  </div>
  <div id="scan-status" class="status-msg"></div>

  <div id="table-area"></div>
</div>

<script>
let catalogs = [];
let sortKey = 'end_date';
let sortDir = 1;

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

async function loadCatalogs() {
  try {
    const r = await api('GET', '/api/auction-monitor/catalogs');
    catalogs = r.catalogs || [];
    renderTable();
  } catch(e) {
    document.getElementById('table-area').innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
  }
}

async function scanNow() {
  document.getElementById('scan-status').textContent = 'Starting scan (background, walks the full BidSpotter US catalog list)...';
  try {
    const r = await api('POST', '/api/auction-monitor/scan-now');
    if (r.already_running) {
      document.getElementById('scan-status').textContent = 'Already running — polling...';
    }
    pollScan();
  } catch(e) {
    document.getElementById('scan-status').textContent = `❌ ${e.message}`;
  }
}

async function pollScan() {
  try {
    const r = await api('GET', '/api/auction-monitor/scan-status');
    if (r.running) {
      document.getElementById('scan-status').textContent = 'Scanning BidSpotter — safe to leave open...';
      setTimeout(pollScan, 4000);
      return;
    }
    if (r.result) {
      if (r.result.error) {
        document.getElementById('scan-status').textContent = `❌ ${r.result.error}`;
      } else {
        const failedPage = r.result.diagnostics && r.result.diagnostics.pages.find(p => p.status >= 400);
        if (failedPage) {
          document.getElementById('scan-status').innerHTML =
            `❌ Blocked on page ${failedPage.page} (HTTP ${failedPage.status}). Response from BidSpotter:<br>` +
            `<pre style="white-space:pre-wrap;background:#0f1420;padding:10px;border-radius:6px;margin-top:6px;font-size:11px;max-height:300px;overflow:auto;">${(failedPage.response_body_snippet || '(empty)').replace(/</g,'&lt;')}</pre>`;
        } else {
          const diag = r.result.diagnostics ? ` [pages: ${JSON.stringify(r.result.diagnostics.pages)}]` : '';
          document.getElementById('scan-status').textContent =
            `✅ Checked ${r.result.checked} catalogs — ${r.result.new} new, ${r.result.updated} updated.${diag}`;
        }
      }
      loadCatalogs();
    }
  } catch(e) {
    document.getElementById('scan-status').textContent = `❌ ${e.message}`;
  }
}

function renderTable() {
  if (!catalogs.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">No catalogs tracked yet — click "Scan for Catalogs" above.</div>';
    return;
  }
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  let filtered = catalogs;
  if (search) {
    filtered = filtered.filter(c =>
      (c.title || '').toLowerCase().includes(search) ||
      (c.auctioneer || '').toLowerCase().includes(search) ||
      (c.state || '').toLowerCase().includes(search));
  }
  filtered = [...filtered].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    av = av ?? ''; bv = bv ?? '';
    const cmp = av > bv ? 1 : (av < bv ? -1 : 0);
    return cmp * sortDir;
  });
  const th = (key, label) => `<th onclick="setSort('${key}')" style="cursor:pointer;">${label}${sortKey===key ? (sortDir===1?' ▲':' ▼') : ''}</th>`;
  let html = `<table><thead><tr>
    ${th('title','Auction')}${th('auctioneer','Auctioneer')}${th('end_date','Date')}${th('state','State')}${th('lot_count','Lot Count')}
  </tr></thead><tbody>`;
  for (const c of filtered) {
    html += `<tr>
      <td><a href="${c.catalog_url}" target="_blank">${(c.title || '').replace(/</g,'&lt;')}</a></td>
      <td class="muted">${(c.auctioneer || '—').replace(/</g,'&lt;')}</td>
      <td class="muted">${c.end_date || '—'}</td>
      <td class="muted">${c.state || '—'}</td>
      <td>${c.lot_count != null ? c.lot_count + ' (est.)' : '—'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('table-area').innerHTML = html;
}

loadCatalogs();
</script>
</body>
</html>
