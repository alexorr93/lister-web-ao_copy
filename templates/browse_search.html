<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Browse Search — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #16a34a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); text-decoration: none; display: inline-block; font-family: inherit; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-spacer { flex: 1; }
.nav-account { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.add-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; flex-wrap: wrap; }
.add-bar input[type=text] { flex: 1; min-width: 220px; background: #fff; color: #111; border: none; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.add-bar input[type=date] { background: #fff; color: #111; border: none; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.field-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
.date-field { display: flex; flex-direction: column; gap: 4px; }
.btn { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--accent); border-color: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-small { padding: 6px 10px; font-size: 12px; }
.btn-outline { background: transparent; color: var(--text); }
.btn-danger { background: transparent; border-color: #7f1d1d; color: #ef4444; }
.status-msg { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
td a { color: #60a5fa; text-decoration: none; }
td a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.query-cell { font-weight: 600; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.results-panel { display: none; margin: -8px 0 16px 0; }
.results-panel.open { display: block; }
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="main">
  <h1>Browse Search</h1>
  <div class="sub">Set up saved searches for parts you want to watch. Select a start date — results include everything listed from that date through today.</div>

  <div class="add-bar">
    <input type="text" id="query-input" placeholder="e.g. cummins turbocharger" onkeydown="if(event.key==='Enter') runSearch()">
    <div class="date-field">
      <span class="field-label">Listed from</span>
      <input type="date" id="date-input">
    </div>
    <div class="date-field">
      <span class="field-label">Min price ($)</span>
      <input type="number" id="min-price-input" min="0" step="1" placeholder="0" style="width:100px;">
    </div>
    <button class="btn" id="run-btn" onclick="runSearch()">Save &amp; Run</button>
    <button class="btn" id="run-all-btn" onclick="runAll()" style="background:#2563eb;border-color:#2563eb;">▶ Run All</button>
  </div>

  <div id="status" class="status-msg"></div>

  <table id="saved-table">
    <tr><th>Search</th><th>Last run</th><th>Listed date used</th><th>Min price</th><th>Results found</th><th>Actions</th></tr>
  </table>
</div>

<script>
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
document.getElementById('date-input').value = todayStr();

async function loadSavedSearches() {
  const res = await fetch('/api/saved-searches');
  const data = await res.json();
  const table = document.getElementById('saved-table');
  table.innerHTML = '<tr><th>Search</th><th>Last run</th><th>Listed from</th><th>Min price</th><th>Condition</th><th>Results found</th><th>Actions</th></tr>';
  const searches = data.searches || [];
  if (!searches.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="7" class="empty">No saved searches yet — add one above.</td>';
    table.appendChild(tr);
    return;
  }
  const conditionLabels = {'1000':'New','1500':'New Other','1750':'New w/ Defects'};
  const brandLogos = {
    'cat': '/static/logos/caterpillar.png',
    'caterpillar': '/static/logos/caterpillar.png',
    'cummins': '/static/logos/cummins.webp',
    'paccar': '/static/logos/paccar.webp',
    'john deere': '/static/logos/deere.png',
    'international': '/static/logos/international.webp',
    'truck': null,
  };
  // Group synonyms: searches sharing a groupKey render as one row
  const groupKey = q => {
    const l = (q || '').toLowerCase();
    if (l.includes('caterpillar') || (l.includes('cat') && l.includes('parts'))) return 'caterpillar';
    return l;
  };
  function getBrandLogo(query) {
    const q = (query || '').toLowerCase();
    for (const [key, url] of Object.entries(brandLogos)) {
      if (q.includes(key) && url) return url;
    }
    return null;
  }
  // Group searches
  const groups = [];
  const seen = {};
  searches.forEach((s, idx) => {
    const gk = groupKey(s.query);
    if (seen[gk] !== undefined) {
      groups[seen[gk]].items.push({...s, origIdx: idx});
    } else {
      seen[gk] = groups.length;
      groups.push({key: gk, items: [{...s, origIdx: idx}]});
    }
  });
  // Sort: branded groups first, generic (no logo) last
  groups.sort((a, b) => {
    const aHas = getBrandLogo(a.items[0].query) ? 0 : 1;
    const bHas = getBrandLogo(b.items[0].query) ? 0 : 1;
    return aHas - bHas;
  });
  groups.forEach((g, gIdx) => {
    const primary = g.items[0];
    const totalResults = g.items.reduce((sum, s) => sum + (s.last_result_count || 0), 0);
    const condStr = primary.condition_ids ? primary.condition_ids.split(',').map(c => conditionLabels[c.trim()] || c.trim()).join(', ') : '-';
    const logo = getBrandLogo(primary.query);
    const logoHtml = logo ? `<img src="${logo}" style="height:36px;max-width:60px;border-radius:3px;object-fit:contain;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'">` : '';
    const displayName = g.items.length > 1 ? g.key + ' parts lot' : primary.query;
    const queryList = g.items.map(s => s.query).join('|||');
    const tr = document.createElement('tr');
    tr.id = `search-row-${gIdx}`;
    tr.innerHTML = `
      <td class="query-cell">${logoHtml}${displayName}</td>
      <td class="muted">${primary.last_run_at ? new Date(primary.last_run_at).toLocaleString() : 'never'}</td>
      <td class="muted">${primary.last_run_date || '-'}</td>
      <td class="muted">${primary.min_price != null ? '$' + Number(primary.min_price).toFixed(2) : '-'}</td>
      <td class="muted">${condStr}</td>
      <td>${totalResults}</td>
      <td class="actions">
        <button class="btn btn-small btn-outline" onclick="rerunGroup('${escapeAttr(queryList)}')">Run again</button>
        <button class="btn btn-small btn-outline" onclick="toggleGroupResults(${gIdx}, '${escapeAttr(queryList)}', '${primary.last_run_date || ''}')">${totalResults > 0 ? '▶ Results' : 'View results'}</button>
      </td>`;
    table.appendChild(tr);
  });
  // Auto-expand groups with results
  groups.forEach((g, gIdx) => {
    const totalResults = g.items.reduce((sum, s) => sum + (s.last_result_count || 0), 0);
    const queryList = g.items.map(s => s.query).join('|||');
    if (totalResults > 0) toggleGroupResults(gIdx, queryList, g.items[0].last_run_date || '');
  });
}

function escapeAttr(s) { return (s || '').replace(/'/g, "\\'"); }

async function runSearch() {
  const q = document.getElementById('query-input').value.trim();
  const listedDate = document.getElementById('date-input').value || todayStr();
  const minPrice = document.getElementById('min-price-input').value;
  if (!q) return;
  await executeRun(q, listedDate, minPrice === '' ? null : Number(minPrice), null);
  document.getElementById('query-input').value = '';
}

async function rerunSaved(query, minPrice, conditionIds) {
  const listedDate = document.getElementById('date-input').value || todayStr();
  await executeRun(query, listedDate, minPrice, conditionIds || null);
}

async function rerunGroup(queryList) {
  const queries = queryList.split('|||');
  const listedDate = document.getElementById('date-input').value || todayStr();
  const status = document.getElementById('status');
  for (const q of queries) {
    status.textContent = `Running "${q}"...`;
    try {
      const payload = {query: q, listed_date: listedDate};
      await fetch('/api/saved-searches/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    } catch(e) {}
  }
  status.textContent = '✓ Done';
  await loadSavedSearches();
}

async function toggleGroupResults(gIdx, queryList, listedDate) {
  // If already expanded, collapse
  const existing = document.querySelectorAll(`.inline-result-${gIdx}`);
  if (existing.length) { existing.forEach(el => el.remove()); return; }

  const parentRow = document.getElementById(`search-row-${gIdx}`);
  const queries = queryList.split('|||');

  // Fetch results for all queries in group, merge and dedupe by item_id
  let allRows = [];
  const seenIds = new Set();
  for (const q of queries) {
    const params = new URLSearchParams({q});
    if (listedDate) params.set('listed_date', listedDate);
    try {
      const res = await fetch('/api/saved-searches/results?' + params.toString());
      const data = await res.json();
      for (const r of (data.rows || [])) {
        if (!seenIds.has(r.item_id)) { seenIds.add(r.item_id); allRows.push(r); }
      }
    } catch(e) {}
  }

  if (!allRows.length) {
    const emptyRow = document.createElement('tr');
    emptyRow.className = `inline-result-${gIdx}`;
    emptyRow.innerHTML = `<td colspan="7" class="muted" style="text-align:center;padding:12px;">No results stored yet.</td>`;
    parentRow.after(emptyRow);
    return;
  }

  let insertAfter = parentRow;
  allRows.forEach(r => {
    const opts = (r.buying_options || '').split(',').map(o => {
      if (o === 'AUCTION') return '🔨 Auction';
      if (o === 'FIXED_PRICE') return 'BIN';
      if (o === 'BEST_OFFER') return 'Best Offer';
      return o;
    }).join(' + ');
    const tr = document.createElement('tr');
    tr.className = `inline-result-${gIdx}`;
    tr.style.background = '#151b2b';
    tr.innerHTML = `
      <td>${r.image_url ? `<img src="${r.image_url}">` : ''}</td>
      <td colspan="2"><a href="${r.item_web_url}" target="_blank" style="color:#60a5fa;">${r.title || ''}</a></td>
      <td>$${r.price ? Number(r.price).toFixed(2) : '-'}</td>
      <td class="muted">${opts || '-'}</td>
      <td class="muted">${r.condition || '-'}</td>
      <td style="white-space:nowrap;">
        <button onclick="viewItemDetail('${r.item_id}')" style="background:none;border:1px solid #3b82f6;color:#3b82f6;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;">Details →</button>
        ${r.ai_eval
          ? `<button onclick="showEvalPopup('${r.item_id}', null, this)" data-eval="${btoa(unescape(encodeURIComponent(r.ai_eval)))}" style="background:#16a34a;border:none;color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;margin-left:4px;">📋 View Eval</button>`
          : `<button id="eval-inline-${r.item_id}" onclick="runEvalInline('${r.item_id}', this)" style="background:#e67e22;border:none;color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;margin-left:4px;">⚡ GPT</button>`
        }
        <button onclick="dismissResult(${r.id}, this)" style="background:none;border:none;color:#666;font-size:14px;cursor:pointer;margin-left:4px;" title="Dismiss permanently">✕</button>
        <span id="eval-status-${r.item_id}" style="color:#aaa;font-size:11px;margin-left:4px;"></span>
      </td>`;
    insertAfter.after(tr);
    insertAfter = tr;
  });
}

async function runAll() {
  const btn = document.getElementById('run-all-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  const listedDate = document.getElementById('date-input').value || todayStr();

  // Fetch current saved searches
  const res = await fetch('/api/saved-searches');
  const data = await res.json();
  const searches = data.searches || [];
  if (!searches.length) { status.textContent = 'No saved searches to run.'; btn.disabled = false; return; }

  let total = 0;
  for (let i = 0; i < searches.length; i++) {
    const s = searches[i];
    status.textContent = `Running ${i+1}/${searches.length}: "${s.query}"...`;
    try {
      const payload = {query: s.query, listed_date: listedDate, min_price: s.min_price};
      if (s.condition_ids) payload.condition_ids = s.condition_ids;
      const r = await fetch('/api/saved-searches/run', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (r.ok) {
        const d = await r.json();
        total += d.count;
      }
    } catch (e) { /* continue to next */ }
  }
  status.textContent = `✓ Ran all ${searches.length} searches — ${total} total results.`;
  await loadSavedSearches();
  btn.disabled = false;
}

async function executeRun(query, listedDate, minPrice, conditionIds) {
  const btn = document.getElementById('run-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = `Searching eBay for "${query}" listed on ${listedDate}${minPrice != null ? ' at $' + minPrice + '+' : ''}...`;
  try {
    const payload = {query, listed_date: listedDate, min_price: minPrice};
    if (conditionIds) payload.condition_ids = conditionIds;
    const res = await fetch('/api/saved-searches/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: res.statusText}));
      status.textContent = 'Error: ' + (err.detail || res.statusText);
      btn.disabled = false;
      return;
    }
    const data = await res.json();
    status.textContent = `Found ${data.count} listing(s) for "${data.query}" listed on ${data.listed_date} — saved.`;
    await loadSavedSearches();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
  btn.disabled = false;
}

async function deleteSaved(id) {
  if (!confirm('Delete this saved search?')) return;
  await fetch(`/api/saved-searches/${id}`, {method: 'DELETE'});
  await loadSavedSearches();
}

async function viewItemDetail(itemId) {
  const existing = document.getElementById('detail-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'detail-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:999;overflow-y:auto;padding:2rem;';
  modal.innerHTML = '<div style="color:#fff;text-align:center;padding:4rem;">Loading item details...</div>';
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);

  try {
    const res = await fetch(`/api/browse-item/${encodeURIComponent(itemId)}`);
    if (!res.ok) throw new Error('Failed to load item');
    const d = await res.json();
    const imgs = (d.images || []).map(url =>
      `<img src="${url}" style="max-width:100%;max-height:400px;margin:0.5rem;border-radius:4px;">`
    ).join('');
    modal.innerHTML = `
      <div style="max-width:900px;margin:0 auto;background:#1a1a2e;border-radius:8px;padding:1.5rem;position:relative;">
        <button onclick="this.closest('#detail-modal').remove()" style="position:absolute;top:0.5rem;right:0.75rem;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">✕</button>
        <h3 style="color:#fff;margin-top:0;">${d.title || ''}</h3>
        <p style="color:#aaa;">$${d.price || '?'} · ${d.condition || ''} · ${(d.buying_options || []).join(' + ')}</p>
        <p style="color:#aaa;">Seller: ${d.seller || '?'} · Bids: ${d.bid_count ?? '-'}</p>
        <div style="margin:0.75rem 0;">
          <button id="eval-btn" class="btn btn-small" onclick="runEval('${itemId}')" style="background:#e67e22;border:none;color:#fff;padding:0.4rem 1rem;border-radius:4px;cursor:pointer;">⚡ GPT Evaluate</button>
          <span id="eval-status" style="color:#aaa;margin-left:0.5rem;font-size:0.85rem;"></span>
        </div>
        <div id="eval-result" style="${d.ai_eval ? '' : 'display:none;'}background:#111;border:1px solid #444;border-radius:6px;padding:1rem;margin:0.75rem 0;color:#eee;font-size:0.9rem;white-space:pre-wrap;">${d.ai_eval || ''}</div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;margin:1rem 0;">${imgs || '<span style="color:#666;">No photos</span>'}</div>
        <div style="color:#ccc;font-size:0.85rem;max-height:300px;overflow-y:auto;margin-top:1rem;border-top:1px solid #333;padding-top:1rem;">${d.description || ''}</div>
      </div>`;
  } catch (e) {
    modal.innerHTML = `<div style="color:red;text-align:center;padding:4rem;">Error: ${e.message}</div>`;
  }
}

async function dismissResult(resultId, btn) {
  const row = btn.closest('tr');
  try {
    await fetch(`/api/browse-results/${resultId}/dismiss`, {method: 'POST'});
    row.remove();
  } catch (e) { /* silently fail */ }
}

async function runEvalInline(itemId, btn) {
  const statusEl = document.getElementById(`eval-status-${itemId}`);
  btn.disabled = true;
  statusEl.textContent = 'Evaluating...';

  // First ensure item details are fetched (needed by the eval endpoint)
  try {
    await fetch(`/api/browse-item/${encodeURIComponent(itemId)}`);
  } catch (e) { /* already fetched is fine */ }

  try {
    const res = await fetch(`/api/browse-item/${encodeURIComponent(itemId)}/evaluate`, {method: 'POST'});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Eval failed');
    const d = await res.json();
    btn.style.background = '#16a34a';
    btn.style.border = '1px solid #16a34a';
    btn.textContent = '📋 View Eval';
    btn.onclick = () => showEvalPopup(itemId, d.evaluation, btn);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '✗ ' + e.message;
  }
  btn.disabled = false;
}

function showEvalPopup(itemId, evalText, anchorBtn) {
  // Remove any existing popup
  const old = document.getElementById('eval-popup');
  if (old) { old.remove(); return; }

  // Read from data attribute if no text passed directly
  if (!evalText && anchorBtn && anchorBtn.dataset.eval) {
    try { evalText = decodeURIComponent(escape(atob(anchorBtn.dataset.eval))); } catch(e) {}
  }

  // Convert markdown links [text](url) to HTML <a> tags and pipe tables to HTML tables
  let html = (evalText || 'No evaluation stored.')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#60a5fa;">$1</a>')
    .replace(/\n/g, '<br>');
  // Convert pipe-delimited table rows
  if (html.includes('|')) {
    html = html.replace(/((?:[^<]*\|[^<]*(?:<br>)?)+)/g, (match) => {
      const rows = match.split('<br>').filter(r => r.includes('|'));
      if (rows.length < 2) return match;
      let table = '<table style="width:100%;border-collapse:collapse;margin:0.5rem 0;font-size:0.85rem;">';
      rows.forEach((row, i) => {
        const cells = row.split('|').map(c => c.trim()).filter(c => c && !c.match(/^[-:]+$/));
        if (!cells.length) return;
        const tag = i === 0 ? 'th' : 'td';
        const style = i === 0 ? 'border-bottom:1px solid #444;padding:4px 8px;text-align:left;color:#aaa;font-size:0.8rem;' : 'padding:4px 8px;border-bottom:1px solid #2a2a3e;';
        table += '<tr>' + cells.map(c => `<${tag} style="${style}">${c}</${tag}>`).join('') + '</tr>';
      });
      table += '</table>';
      return table;
    });
  }

  const popup = document.createElement('div');
  popup.id = 'eval-popup';
  popup.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:1px solid #444;border-radius:8px;padding:1.5rem;max-width:750px;width:90%;max-height:70vh;overflow-y:auto;z-index:1000;color:#eee;font-size:0.9rem;box-shadow:0 8px 32px rgba(0,0,0,0.6);';
  popup.innerHTML = `<button onclick="this.parentElement.remove()" style="position:absolute;top:0.5rem;right:0.75rem;background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">✕</button><div style="margin-top:0.5rem;">${html}</div>`;
  document.body.appendChild(popup);
  // Click outside to close
  setTimeout(() => {
    const handler = (e) => { if (!popup.contains(e.target) && e.target !== anchorBtn) { popup.remove(); document.removeEventListener('click', handler); } };
    document.addEventListener('click', handler);
  }, 100);
}

async function runEval(itemId) {
  const btn = document.getElementById('eval-btn');
  const status = document.getElementById('eval-status');
  const result = document.getElementById('eval-result');
  btn.disabled = true;
  status.textContent = 'Analyzing...';
  try {
    const res = await fetch(`/api/browse-item/${encodeURIComponent(itemId)}/evaluate`, {method: 'POST'});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Eval failed');
    const d = await res.json();
    result.style.display = 'block';
    result.textContent = d.evaluation;
    status.textContent = '✓';
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
  btn.disabled = false;
}

loadSavedSearches();
</script>
