<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Financials — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root {
  --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a; --red: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; font-family: inherit; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.nav-account { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.nav-intake     { color: #3b82f6; }
.nav-upload     { color: #22b8d8; }
.nav-fastscan   { color: #22c55e; }
.nav-archive    { color: #ef4444; }
.nav-inventory  { color: #a78bfa; }
.nav-financials { color: #eab308; }
.nav-analytics  { color: #06b6d4; }
.nav-lots       { color: #fb923c; }
.nav-shopify    { color: #95bf47; }
.nav-categories { color: #14b8a6; }
.nav-auction    { color: #f59e0b; }
.nav-settings   { color: #94a3b8; }
.nav-intake.active     { background: #2563eb; color: #fff; }
.nav-upload.active     { background: #0891b2; color: #fff; }
.nav-fastscan.active   { background: #16a34a; color: #fff; }
.nav-archive.active    { background: #dc2626; color: #fff; }
.nav-inventory.active  { background: #7c3aed; color: #fff; }
.nav-financials.active { background: #ca8a04; color: #fff; }
.nav-analytics.active  { background: #0891b2; color: #fff; }
.nav-lots.active       { background: #ea580c; color: #fff; }
.nav-shopify.active    { background: #95bf47; color: #fff; }
.nav-categories.active { background: #0d9488; color: #fff; }
.nav-auction.active    { background: #f59e0b; color: #1a0611; }
.nav-settings.active   { background: #475569; color: #fff; }
.main { max-width: 1300px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.filter-bar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.field-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: #1e2535; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.quick-range { display: flex; gap: 6px; }
.quick-range button { padding: 8px 10px; font-size: 12px; }
.summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.summary-card .num { font-size: 22px; font-weight: 800; }
.summary-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
.sku { font-weight: 700; font-family: monospace; }
.platform-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
.platform-tag.ebay { background: #0064d2; color: #fff; }
.platform-tag.shopify { background: #95bf47; color: #fff; }
.muted { color: var(--muted); }
.error-banner { background: rgba(220,38,38,0.15); border: 1px solid var(--red); color: #fca5a5; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="main">
  <h1>Financials</h1>
  <div class="sub">One row per order across eBay and Shopify, for the selected date range.</div>

  <div class="filter-bar">
    <div>
      <div class="field-label">Start Date</div>
      <input type="date" class="field-input" id="start-date" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="start-date-nofill-date"/>
    </div>
    <div>
      <div class="field-label">End Date</div>
      <input type="date" class="field-input" id="end-date" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="end-date-nofill-date"/>
    </div>
    <button class="btn btn-primary" onclick="loadFinancials()">Apply</button>
    <div class="quick-range">
      <button class="btn" onclick="setToday()">Today</button>
      <button class="btn" onclick="setRange(7)">Last 7d</button>
      <button class="btn" onclick="setRange(30)">Last 30d</button>
      <button class="btn" onclick="setRange(90)">Last 90d</button>
      <button class="btn" onclick="setThisMonth()">This Month</button>
      <button class="btn" onclick="setLastMonth()">Last Month</button>
    </div>
    <div>
      <div class="field-label">Lot</div>
      <select class="field-input" id="lot-filter" onchange="renderTable()">
        <option value="">All Lots</option>
      </select>
    </div>
    <div>
      <div class="field-label">Search SKU</div>
      <input type="text" class="field-input" id="sku-search" placeholder="e.g. RJ, M64" oninput="renderTable()" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="fin-sku-search-nofill"/>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;padding-bottom:8px;">
      <input type="checkbox" id="net-toggle" checked onchange="renderTable()"/> Net (All Fees)
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;padding-bottom:8px;">
      <input type="checkbox" id="shopify-toggle" checked onchange="loadFinancials()"/> Include Shopify
    </label>
    <div>
      <div class="field-label">Pirate Ship Export</div>
      <input type="file" id="shipping-file-input" accept=".csv,.xlsx" style="font-size:12px;" onchange="uploadShippingFile()"/>
    </div>
    <button class="btn btn-primary" onclick="syncNow()" title="Pulls fresh orders, fees, and shipping matches into the local database — this is what keeps Financials accurate">🔄 Sync Now <span style="font-size:10px;opacity:.8;">(live API)</span></button>
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;padding-bottom:8px;" title="Normally resumes from where the last run left off. Check this to ignore that and re-walk everything from the start (needed after a code change that affects already-completed months).">
      <input type="checkbox" id="force-restart-toggle"/> Force full restart
    </label>
    <button class="btn" onclick="backfillTracking()" title="Fast: only re-fetches missing tracking numbers, skips re-pulling orders/fees entirely">🏷️ Fix Tracking Numbers</button>
    <button class="btn" onclick="applyShippingMatches()" title="Local-only, instant: re-matches tracking numbers against shipping_labels and writes the result into orders. No API calls.">📦 Apply Shipping Matches</button>
    <span id="last-synced" style="font-size:11px;color:var(--muted);align-self:center;"></span>
  </div>
  <div id="shipping-status" style="font-size:12px;color:var(--muted);margin-bottom:10px;"></div>
  <div style="display:flex;gap:8px;align-items:end;margin-bottom:14px;">
    <div>
      <div class="field-label">Resync One Order (fast, seconds)</div>
      <input type="text" class="field-input" id="resync-order-id" placeholder="e.g. 08-14824-55634" style="width:220px;" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="resync-order-nofill"/>
    </div>
    <button class="btn" onclick="resyncOneOrder()" title="Pulls this one order fresh from eBay">🔁 Resync This Order <span style="font-size:10px;opacity:.8;">(live API)</span></button>
  </div>

  <div id="error-area"></div>

  <div class="summary-row" id="summary-row" style="display:none;">
    <div class="summary-card"><div class="num" id="sum-orders">0</div><div class="label">Order Lines</div></div>
    <div class="summary-card"><div class="num" id="sum-qty">0</div><div class="label">Units Sold</div></div>
    <div class="summary-card"><div class="num" id="sum-revenue">$0</div><div class="label" id="sum-revenue-label">Total Net</div></div>
    <div class="summary-card" id="sum-uncat-card" style="cursor:pointer;border:1px solid #f59e0b;" onclick="toggleUncategorizedView()" title="Click to show only these orders">
      <div class="num" id="sum-uncat" style="color:#f59e0b;">0</div><div class="label">Uncategorized SKUs</div>
    </div>
  </div>

  <div id="table-area"><div class="empty">Pick a date range and click Apply.</div></div>
</div>

<script>
function setToday() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('start-date').value = today;
  document.getElementById('end-date').value = today;
  loadFinancials();
}

function setRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(start.getDate() - days);
  document.getElementById('end-date').value = end.toISOString().slice(0,10);
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  loadFinancials();
}

function setThisMonth() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  document.getElementById('end-date').value = now.toISOString().slice(0,10);
  loadFinancials();
}

function setLastMonth() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const end = new Date(now.getFullYear(), now.getMonth(), 0); // last day of previous month
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  document.getElementById('end-date').value = end.toISOString().slice(0,10);
  loadFinancials();
}

let sortKey = 'total_amount', sortDir = -1;
let currentData = [];
let allOrderLines = [];
let uncategorizedItems = [];
let showingUncategorized = false;

function toggleUncategorizedView() {
  showingUncategorized = !showingUncategorized;
  currentData = showingUncategorized ? uncategorizedItems : allOrderLines;
  document.getElementById('sum-uncat-card').style.background = showingUncategorized ? '#f59e0b22' : '';
  populateLotFilter();
  renderTable();
}

async function uploadShippingFile() {
  const input = document.getElementById('shipping-file-input');
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  document.getElementById('shipping-status').textContent = 'Uploading...';
  try {
    const r = await fetch('/api/shipping-labels/upload', {method: 'POST', body: fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Upload failed');
    document.getElementById('shipping-status').textContent =
      `✅ Imported ${data.inserted} label(s), matched shipping cost into ${data.matched} order(s).${data.skipped ? ' (' + data.skipped + ' skipped)' : ''}`;
    loadFinancials();
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
  input.value = '';
}

async function applyShippingMatches() {
  document.getElementById('shipping-status').textContent = 'Applying shipping matches (local only, instant)...';
  try {
    const r = await fetch('/api/financials/apply-shipping-matches', {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    document.getElementById('shipping-status').textContent = `✅ Matched ${data.updated} order(s). [debug: ${data.orders_with_tracking} orders w/ tracking, ${data.debug_labels_fetched} labels fetched, ${data.debug_matches_found} matches found]`;
    loadFinancials();
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
}

async function resyncOneOrder() {
  const orderId = document.getElementById('resync-order-id').value.trim();
  if (!orderId) return;
  document.getElementById('shipping-status').textContent = `Resyncing order ${orderId}...`;
  try {
    const r = await fetch(`/api/financials/resync-one-order/${encodeURIComponent(orderId)}`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    document.getElementById('shipping-status').textContent = `✅ Resynced order ${orderId} — ${data.line_items_updated} line item(s) updated.`;
    loadFinancials();
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
}

async function backfillTracking() {
  document.getElementById('shipping-status').textContent = 'Fixing tracking numbers (fast — skips order/fee refetch)...';
  try {
    const r = await fetch('/api/financials/backfill-tracking', {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed to start');
    pollSyncStatus();
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
}

let _lastSyncWasForceRestart = false;

async function syncNow() {
  document.getElementById('shipping-status').textContent = 'Starting sync (this runs in the background — safe to leave this page open, or come back later)...';
  try {
    const forceRestart = document.getElementById('force-restart-toggle').checked;
    _lastSyncWasForceRestart = forceRestart;
    // A normal click only needs to catch up the last couple weeks -- the
    // automated background worker already keeps everything else current
    // every 20 minutes. Only walk the full ~2-year range when force restart
    // is explicitly checked (e.g. after a fix that needs historical months
    // re-pulled), which is what that option is actually for.
    const daysBack = forceRestart ? 720 : 14;
    const r = await fetch(`/api/financials/sync-now?days_back=${daysBack}&resume=${!forceRestart}`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Sync failed to start');
    pollSyncStatus();
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
}

async function pollSyncStatus() {
  try {
    const r = await fetch('/api/financials/sync-status');
    const data = await r.json();
    if (data.running) {
      document.getElementById('shipping-status').textContent = _lastSyncWasForceRestart
        ? 'Full resync running (month by month, ~2 years) — this can take a few minutes, safe to leave open...'
        : 'Catching up the last couple weeks — usually quick, safe to leave open...';
      setTimeout(pollSyncStatus, 5000);
      return;
    }
    if (data.result) {
      if (data.result.upserted !== undefined) {
        const errMsg = data.result.errors && Object.keys(data.result.errors).length
          ? ' — some months had issues: ' + Object.entries(data.result.errors).map(([k,v]) => `${k}: ${JSON.stringify(v)}`).join('; ')
          : '';
        document.getElementById('shipping-status').textContent = `✅ Synced ${data.result.upserted} order line(s) this run.${errMsg}`;
      } else if (data.result.updated !== undefined) {
        document.getElementById('shipping-status').textContent = `✅ Fixed tracking on ${data.result.updated} of ${data.result.rows_missing} order(s) that were missing it.`;
      } else if (data.result.error) {
        document.getElementById('shipping-status').textContent = `❌ ${data.result.error}`;
      }
      loadFinancials();
    }
  } catch(e) {
    document.getElementById('shipping-status').textContent = `❌ ${e.message}`;
  }
}

// If a sync is already running when the page loads, resume polling instead of losing track of it.
(async function checkSyncOnLoad() {
  try {
    const r = await fetch('/api/financials/sync-status');
    const data = await r.json();
    if (data.running) pollSyncStatus();
  } catch(e) {}
})();


function lotOf(sku) {
  const idx = String(sku || '').indexOf('-');
  return idx > 0 ? sku.slice(0, idx) : '';
}

function fmtMoney(n) {
  return '$' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtNum(n) {
  return Number(n || 0).toLocaleString('en-US');
}

function populateLotFilter() {
  const sel = document.getElementById('lot-filter');
  const current = sel.value;
  const lots = Array.from(new Set(currentData.map(r => lotOf(r.sku)).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">All Lots</option>' + lots.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
  if (lots.includes(current)) sel.value = current;
}

function renderTable() {
  const lotFilter = document.getElementById('lot-filter').value;
  const searchTerm = document.getElementById('sku-search').value.trim().toLowerCase();
  const netMode = document.getElementById('net-toggle').checked;
  const amtKey = netMode ? 'net' : 'revenue';
  document.getElementById('sum-revenue-label').textContent = netMode ? 'Total Net' : 'Total Revenue';

  let filtered = lotFilter ? currentData.filter(r => lotOf(r.sku) === lotFilter) : currentData;
  if (searchTerm) filtered = filtered.filter(r => r.sku.toLowerCase().includes(searchTerm));

  const orderLines = filtered.length;
  const qty = filtered.reduce((n, r) => n + r.quantity, 0);
  const amount = filtered.reduce((n, r) => n + r[amtKey], 0);
  document.getElementById('sum-orders').textContent = fmtNum(orderLines);
  document.getElementById('sum-qty').textContent = fmtNum(qty);
  document.getElementById('sum-revenue').textContent = fmtMoney(amount);

  const activeSortKey = sortKey === 'total_amount' ? amtKey : sortKey;
  const rows = [...filtered].sort((a,b) => {
    const v = (a[activeSortKey] > b[activeSortKey]) ? 1 : (a[activeSortKey] < b[activeSortKey] ? -1 : 0);
    return v * sortDir;
  });
  if (!rows.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">No orders match this filter.</div>';
    return;
  }
  const th = (key, label) => `<th onclick="setSort('${key}')">${label}${sortKey===key ? (sortDir===1?' ▲':' ▼') : ''}</th>`;
  const amtLabel = netMode ? 'Net $' : 'Gross $';
  const reasonHeader = showingUncategorized ? '<th>Reason</th>' : '';
  const overrideHeader = showingUncategorized ? '<th>Custom SKU (override)</th>' : '';
  let html = `<table><thead><tr>
    ${th('sku','SKU')}${overrideHeader}${reasonHeader}${th('order_id','Order #')}${th('order_date','Date')}${th('platform','Platform')}${th('quantity','Qty')}${th('buyer_shipping','Buyer Paid Ship $')}${th('shipping_cost','Label Cost $')}${th('total_amount',amtLabel)}${th('title','Item')}
  </tr></thead><tbody>`;
  for (const r of rows) {
    const tag = r.platform === 'eBay' ? '<span class="platform-tag ebay">eBay</span>' : '<span class="platform-tag shopify">Shopify</span>';
    const reasonCell = showingUncategorized
      ? `<td>${r.needs_sku ? '<span style="color:#f59e0b;font-weight:600;">Needs SKU</span>' : '<span class="muted">No matching lot</span>'}</td>`
      : '';
    const overrideCell = showingUncategorized
      ? `<td>${r.sku_override ? `<span style="color:var(--green,#16a34a);font-weight:600;">${escapeHtml(r.sku_override)}</span>` : '<span class="muted">—</span>'}</td>`
      : '';
    const skuCell = showingUncategorized
      ? `<input type="text" class="field-input order-sku-input" data-row-id="${r.id}" value="${escapeHtml(r.sku)}" style="width:100px;font-size:12px;padding:4px 6px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" name="order-sku-${r.id}"/>
         <button class="btn" style="font-size:11px;padding:2px 8px;" onclick="saveOrderSku(this, '${r.id}')">Save</button>`
      : `<span class="sku">${escapeHtml(r.sku)}</span>`;
    html += `<tr>
      <td>${skuCell}</td>
      ${overrideCell}
      ${reasonCell}
      <td class="muted">${escapeHtml(r.order_id)}</td>
      <td class="muted">${escapeHtml(r.order_date)}</td>
      <td>${tag}</td>
      <td>${fmtNum(r.quantity)}</td>
      <td class="muted">${r.buyer_shipping ? fmtMoney(r.buyer_shipping) : '—'}</td>
      <td class="muted">${r.shipping_cost ? fmtMoney(r.shipping_cost) : '—'}</td>
      <td><b>${fmtMoney(r[amtKey])}</b></td>
      <td class="muted">${escapeHtml(r.title || '')}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('table-area').innerHTML = html;
}

async function saveOrderSku(btn, rowId) {
  const input = document.querySelector(`.order-sku-input[data-row-id="${rowId}"]`);
  const newSku = input.value.trim();
  if (!newSku) { alert('SKU cannot be blank'); return; }
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const r = await fetch('/api/orders/sku', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({order_row_id: rowId, new_sku: newSku}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed to update SKU');

    // Update in place rather than a full reload, which would reset the view back
    // to "all orders" and lose your spot in the Uncategorized filter.
    const lineRow = allOrderLines.find(r => r.id === rowId);
    if (lineRow) lineRow.sku = newSku;
    // Update the SKU in place so it's actually visible, instead of silently
    // deleting the row — that hid the value you just typed and made it look
    // like nothing happened. Only drop it from the Uncategorized list once
    // the server confirms it now matches a known lot (data.recategorized).
    const uncatRow = uncategorizedItems.find(r => r.id === rowId);
    if (uncatRow) { uncatRow.sku = newSku; uncatRow.needs_sku = false; }
    if (data.recategorized) {
      uncategorizedItems = uncategorizedItems.filter(r => r.id !== rowId);
    }
    document.getElementById('sum-uncat').textContent =
      fmtNum(uncategorizedItems.length) + ' (' + fmtMoney(uncategorizedItems.reduce((n, r) => n + (r.net || 0), 0)) + ')';
    currentData = showingUncategorized ? uncategorizedItems : allOrderLines;
    renderTable();
  } catch(e) {
    alert(`Failed to update SKU: ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
  renderTable();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadFinancials() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  const includeShopify = document.getElementById('shopify-toggle').checked;
  document.getElementById('table-area').innerHTML = `<div class="empty">Loading orders from eBay${includeShopify ? ' + Shopify' : ''}...</div>`;
  document.getElementById('error-area').innerHTML = '';
  try {
    const params = new URLSearchParams();
    if (start) params.set('start', start);
    if (end) params.set('end', end);
    params.set('include_shopify', includeShopify ? 'true' : 'false');
    const res = await fetch('/api/financials?' + params.toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to load');

    if (data.errors && Object.keys(data.errors).length) {
      const msgs = Object.entries(data.errors).map(([k,v]) => `<b>${k}</b>: ${escapeHtml(v)}`).join('<br>');
      document.getElementById('error-area').innerHTML = `<div class="error-banner">Some data may be incomplete —<br>${msgs}</div>`;
    }

    document.getElementById('summary-row').style.display = 'grid';
    document.getElementById('sum-orders').textContent = fmtNum(data.totals.orders);
    document.getElementById('sum-qty').textContent = fmtNum(data.totals.quantity);
    document.getElementById('sum-revenue').textContent = fmtMoney(data.totals.net);
    document.getElementById('sum-uncat').textContent =
      fmtNum(data.uncategorized?.count || 0) + ' (' + fmtMoney(data.uncategorized?.net || 0) + ')';

    allOrderLines = data.order_lines;
    uncategorizedItems = data.uncategorized?.items || [];
    showingUncategorized = false;
    document.getElementById('sum-uncat-card').style.background = '';
    currentData = allOrderLines;
    if (data.last_synced_at) {
      const d = new Date(data.last_synced_at);
      document.getElementById('last-synced').textContent = 'Last synced: ' + d.toLocaleString();
    } else {
      document.getElementById('last-synced').textContent = 'Never synced — click Sync Now';
    }
    populateLotFilter();
    renderTable();
  } catch(e) {
    document.getElementById('table-area').innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// Default to last 30 days on load
setRange(30);
</script>
