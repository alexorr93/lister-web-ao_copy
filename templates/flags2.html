<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flags 2 — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #f59e0b; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; font-family: inherit; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.nav-account { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.nav-auction { color: #f59e0b; }
.nav-auctionmonitor { color: #38bdf8; }
.nav-analytics { color: #a78bfa; }
.nav-flags { color: #fb7185; }
.nav-flags2 { color: #34d399; }
.nav-settings { color: #94a3b8; }
.nav-auction.active { background: #f59e0b; color: #1a0611; }
.nav-auctionmonitor.active { background: #0284c7; color: #fff; }
.nav-analytics.active { background: #7c3aed; color: #fff; }
.nav-flags.active { background: #e11d48; color: #fff; }
.nav-flags2.active { background: #059669; color: #fff; }
.nav-settings.active { background: #475569; color: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.main { max-width: 1800px; margin: 0 auto; padding: 24px 20px 60px; }
#table-area { overflow-x: auto; width: 100%; }
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; max-width: 900px; }
.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 52px; background: var(--bg); }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: rgba(255,255,255,.02); }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
a { color: #60a5fa; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="main">
  <h1>🚩 Flags 2</h1>
  <div class="sub">Purely the automated Bright Data pull — real catalog and lot data pulled directly from BidSpotter with no manual VA involvement. Separate from the original Flags tab above; use this one to compare against it.</div>

  <div class="filter-bar">
    <input type="text" class="field-input" id="search-input" placeholder="Search title/lot/description..." oninput="render()" style="width:320px;" autocomplete="off"/>
    <span class="muted" id="summary-text"></span>
  </div>

  <div id="table-area"><div class="empty">Loading...</div></div>
</div>

<script>
let allLots = [];

function escapeHtml(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function catalogLink(catalogUrl, title) {
  const shown = title || catalogUrl || '';
  const withoutExt = (catalogUrl || '').replace(/\.pdf$/i, '');
  const m = withoutExt.match(/^https(www\.bidspotter\.com)en-usauction-catalogues(.+?)(catalogue-id-.+)$/);
  if (m) {
    const url = `https://${m[1]}/en-us/auction-catalogues/${m[2]}/${m[3]}`;
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(shown)}</a>`;
  }
  return escapeHtml(shown);
}

async function loadAll() {
  try {
    const r = await fetch('/api/flags2-data');
    const data = await r.json();
    allLots = data.lots || [];
  } catch(e) { console.error(e); }
  render();
}

function render() {
  const el = document.getElementById('table-area');
  const search = document.getElementById('search-input').value.toLowerCase();
  let rows = allLots;
  if (search) rows = rows.filter(l =>
    (l.description || '').toLowerCase().includes(search) ||
    (l.lot_number || '').toLowerCase().includes(search) ||
    (l.catalog_title || '').toLowerCase().includes(search));

  const distinctCatalogs = new Set(allLots.map(l => l.catalog_url)).size;
  document.getElementById('summary-text').textContent =
    `${allLots.length} total lot(s) across ${distinctCatalogs} catalog(s)` + (search ? ` — ${rows.length} matching` : '');

  if (!rows.length) { el.innerHTML = '<div class="empty">No Bright Data lots pulled yet — this fills in automatically as the automated pull runs.</div>'; return; }

  let html = `<table><thead><tr><th>Catalog</th><th>Lot #</th><th>Description</th><th>State</th><th>ZIP</th><th>Date</th><th>Pulled At</th></tr></thead><tbody>`;
  for (const l of rows.slice(0, 1000)) {
    const pulledCell = l.last_seen_at
      ? new Date(l.last_seen_at).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';
    html += `<tr>
      <td>${catalogLink(l.catalog_url, l.catalog_title)}</td>
      <td>${escapeHtml(l.lot_number)}</td>
      <td>${escapeHtml(l.description)}</td>
      <td>${escapeHtml(l.state)}</td>
      <td class="muted">${escapeHtml(l.zip_code)}</td>
      <td class="muted">${escapeHtml(l.date)}</td>
      <td class="muted" style="white-space:nowrap;">${pulledCell}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  if (rows.length > 1000) html += `<div class="sub" style="margin-top:8px;">Showing first 1000 of ${rows.length} — narrow with search to see more.</div>`;
  el.innerHTML = html;
}

loadAll();
setInterval(loadAll, 30000); // auto-refresh every 30s so this stays live while the pull keeps running
</script>
</body>
</html>
