<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a; --red: #dc2626; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; font-family: inherit; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.nav-account { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.nav-intake     { color: #3b82f6; }
.nav-upload     { color: #22b8d8; }
.nav-fastscan   { color: #22c55e; }
.nav-archive    { color: #ef4444; }
.nav-inventory  { color: #a78bfa; }
.nav-financials { color: #eab308; }
.nav-analytics  { color: #06b6d4; }
.nav-lots       { color: #fb923c; }
.nav-shopify    { color: #95bf47; }
.nav-categories { color: #14b8a6; }
.nav-auction    { color: #f59e0b; }
.nav-settings   { color: #94a3b8; }
.nav-intake.active     { background: #2563eb; color: #fff; }
.nav-upload.active     { background: #0891b2; color: #fff; }
.nav-fastscan.active   { background: #16a34a; color: #fff; }
.nav-archive.active    { background: #dc2626; color: #fff; }
.nav-inventory.active  { background: #7c3aed; color: #fff; }
.nav-financials.active { background: #ca8a04; color: #fff; }
.nav-analytics.active  { background: #0891b2; color: #fff; }
.nav-lots.active       { background: #ea580c; color: #fff; }
.nav-shopify.active    { background: #95bf47; color: #fff; }
.nav-categories.active { background: #0d9488; color: #fff; }
.nav-auction.active    { background: #f59e0b; color: #1a0611; }
.nav-settings.active   { background: #475569; color: #fff; }
.main { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: #1e2535; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.summary-card .num { font-size: 22px; font-weight: 800; }
.summary-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
.sku-col { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
.muted { color: var(--muted); }
.warn { color: #fbbf24; font-weight: 700; }
.missing { color: var(--red); }
.status-msg { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.mm-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
.mm-modal-overlay.open { display: flex; }
.mm-modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px; }
.mm-candidate { padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
.mm-candidate:hover { background: rgba(37,99,235,0.15); border-color: var(--accent); }
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="main">
  <h1>Inventory</h1>
  <div class="sub">eBay + Shopify inventory, matched by title. Non-matches show up as one-sided rows for manual review.</div>

  <div class="filter-bar">
    <button class="btn btn-primary" onclick="syncInventory()" title="Shopify: live API call, pulls fresh right now. eBay: reads from the local cache filled by the button next to this one.">🔄 Sync Inventory</button>
    <button class="btn" id="sync-ebay-live-btn" onclick="syncEbayActiveListingsFromInventory()" title="The actual live eBay pull — fills eBay Qty, Ship $, and everything else on this page's eBay side. Was previously only on the Lots page; added here too so you never have to hunt for it.">🛰️ Sync eBay Live (Ship $ etc.)</button>
    <span id="ebay-live-sync-status" class="status-msg"></span>
    <button class="btn" onclick="pullEbayPhotos()" title="Downloads up to 2 real photos per eBay-ONLY item (skips anything already matched to a Shopify product) into Lister's own storage — a one-time step needed before these items can be published to Shopify.">📥 Pull eBay-Only Photos (into our storage)</button>
    <button class="btn" id="hidden-inventory-toggle" onclick="toggleHiddenInventoryPanel()">🙈 Hidden Items</button>
    <button class="btn" onclick="hideNoCreatedDate()" title="Hides every eBay-only row with no Created date in one go, instead of one at a time">🙈 Hide All eBay-Only (No Created Date)</button>
    <input type="text" class="field-input" id="search-input" placeholder="Search title/SKU..." oninput="renderTable()" style="width:260px;" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="search-nofill-1a"/>
    <select class="field-input" id="filter-select" onchange="renderTable()">
      <option value="">All</option>
      <option value="matched">Matched (both platforms)</option>
      <option value="ebay_only">eBay Only</option>
      <option value="shopify_only">Shopify Only</option>
      <option value="qty_variance">Quantity Mismatch</option>
      <option value="ship_free">Free Shipping</option>
      <option value="ship_18">$18 Shipping</option>
      <option value="ship_69">$69 Shipping</option>
      <option value="ship_195">$195 Shipping</option>
      <option value="ship_other">Other/Unknown Shipping</option>
    </select>
  </div>
  <div id="sync-status" class="status-msg"></div>
  <div id="photo-pull-status" class="status-msg"></div>
  <div id="hidden-inventory-area" style="display:none;margin-bottom:14px;"></div>

  <div class="summary-row" id="summary-row" style="display:none;">
    <div class="summary-card"><div class="num" id="stat-total">0</div><div class="label">Total Rows</div></div>
    <div class="summary-card"><div class="num" id="stat-matched">0</div><div class="label">Matched</div></div>
    <div class="summary-card"><div class="num" id="stat-ebay-only">0</div><div class="label">eBay Only</div></div>
    <div class="summary-card"><div class="num" id="stat-shopify-only">0</div><div class="label">Shopify Only</div></div>
  </div>

  <div id="table-area"><div class="empty">Click Sync Inventory to pull your current eBay and Shopify listings.</div></div>
</div>

<div class="mm-modal-overlay" id="mm-overlay" onclick="closeManualMatch(event)">
  <div class="mm-modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:16px;font-weight:800;">🔗 Manual Match</div>
      <button class="btn" onclick="closeManualMatch()">✕ Close</button>
    </div>
    <div class="sub" id="mm-source-title" style="margin-bottom:10px;"></div>
    <input type="text" class="field-input" id="mm-search-input" placeholder="Search by title..." oninput="renderMmCandidates()" style="width:100%;margin-bottom:12px;" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="mm-search-nofill-1b"/>
    <div id="mm-candidates"></div>
  </div>
</div>

<script>
let inventory = [];

function toast(msg) {
  // This file never had its own toast() -- other pages define one, this one
  // didn't, so a couple of newer buttons here were silently crashing on click
  // with 'toast is not defined' instead of showing their success message.
  const el = document.getElementById('sync-status');
  if (el) {
    el.textContent = msg;
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadInventory() {
  const r = await fetch('/api/inventory');
  const data = await r.json();
  inventory = data.inventory || [];
  renderTable();
}

async function syncInventory() {
  document.getElementById('sync-status').textContent = 'Starting sync (background, can take a bit for large catalogs)...';
  try {
    const r = await fetch('/api/inventory/sync', {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed to start');
    pollSync();
  } catch(e) {
    document.getElementById('sync-status').textContent = `❌ ${e.message}`;
  }
}

async function pollSync() {
  try {
    const r = await fetch('/api/financials/sync-status');
    const data = await r.json();
    if (data.running) {
      document.getElementById('sync-status').textContent = 'Syncing inventory — safe to leave open...';
      setTimeout(pollSync, 4000);
      return;
    }
    if (data.result) {
      if (data.result.error) {
        document.getElementById('sync-status').textContent = `❌ ${data.result.error}`;
      } else {
        const errMsg = data.result.errors && Object.keys(data.result.errors).length
          ? ' — issues: ' + JSON.stringify(data.result.errors) : '';
        document.getElementById('sync-status').textContent =
          `✅ eBay: ${data.result.ebay_synced}, Shopify: ${data.result.shopify_synced}, Matched: ${data.result.matched} (${data.result.newly_confirmed || 0} newly locked in this run, ${data.result.confirmed_preserved || 0} already permanent), eBay-only: ${data.result.ebay_only}, Shopify-only: ${data.result.shopify_only}${errMsg}`;
      }
      loadInventory();
    }
  } catch(e) {
    document.getElementById('sync-status').textContent = `❌ ${e.message}`;
  }
}

async function pullEbayPhotos() {
  document.getElementById('photo-pull-status').textContent = 'Starting eBay photo download (background, can take a while for many items)...';
  try {
    const r = await fetch('/api/inventory/pull-ebay-photos', {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed to start');
    if (data.already_running) {
      document.getElementById('photo-pull-status').textContent = 'Already running — polling...';
    }
    pollPullEbayPhotos();
  } catch(e) {
    document.getElementById('photo-pull-status').textContent = `❌ ${e.message}`;
  }
}

async function pollPullEbayPhotos() {
  try {
    const r = await fetch('/api/inventory/pull-ebay-photos-status');
    const data = await r.json();
    if (data.running) {
      document.getElementById('photo-pull-status').textContent = 'Downloading eBay photos into our storage — safe to leave open...';
      setTimeout(pollPullEbayPhotos, 4000);
      return;
    }
    if (data.result) {
      if (data.result.error) {
        document.getElementById('photo-pull-status').textContent = `❌ ${data.result.error}`;
      } else {
        document.getElementById('photo-pull-status').textContent =
          `✅ eBay-only items: ${data.result.ebay_only_count}. Checked ${data.result.checked}, downloaded photos for ${data.result.downloaded}, ${data.result.already_had_photos} already had photos, ${data.result.no_photos_found} had none available on eBay.`;
      }
    }
  } catch(e) {
    document.getElementById('photo-pull-status').textContent = `❌ ${e.message}`;
  }
}

let invSortKey = null;
let invSortDir = 1;
function setInvSort(key) {
  if (invSortKey === key) invSortDir *= -1; else { invSortKey = key; invSortDir = 1; }
  renderTable();
}

async function syncEbayActiveListingsFromInventory(force) {
  const statusEl = document.getElementById('ebay-live-sync-status');
  const btn = document.getElementById('sync-ebay-live-btn');
  btn.disabled = true;
  statusEl.textContent = 'Pulling your active eBay listings (runs in the background, can take a while)...';
  try {
    const r = await fetch('/api/acquisitions/sync-active-listings' + (force ? '?force=true' : ''), {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed to start');
    if (data.reason === 'cooldown') {
      if (confirm(`Active listings were synced ${new Date(data.last_synced_at).toLocaleString()} — full resyncs are normally capped to twice a week. Force a resync right now anyway?`)) {
        return syncEbayActiveListingsFromInventory(true);
      }
      statusEl.textContent = `Last synced ${new Date(data.last_synced_at).toLocaleString()}.`;
      btn.disabled = false;
      return;
    }
    pollEbayActiveListingsSyncFromInventory();
  } catch(e) {
    statusEl.textContent = `❌ ${e.message}`;
    btn.disabled = false;
  }
}

async function pollEbayActiveListingsSyncFromInventory() {
  const statusEl = document.getElementById('ebay-live-sync-status');
  const btn = document.getElementById('sync-ebay-live-btn');
  try {
    const r = await fetch('/api/acquisitions/sync-active-listings-status', {cache: 'no-store'});
    const data = await r.json();
    if (data.running) {
      statusEl.textContent = 'Pulling your active eBay listings...';
      setTimeout(pollEbayActiveListingsSyncFromInventory, 4000);
      return;
    }
    btn.disabled = false;
    if (data.result) {
      statusEl.textContent = data.result.error
        ? `❌ ${data.result.error}`
        : `✅ Synced ${data.result.checked} listing(s) — click Sync Inventory above to refresh this table.`;
    }
  } catch(e) {
    statusEl.textContent = `❌ ${e.message}`;
    btn.disabled = false;
  }
}

function renderTable() {
  if (!inventory.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">No inventory synced yet — click Sync Inventory above.</div>';
    document.getElementById('summary-row').style.display = 'none';
    return;
  }
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const filter = document.getElementById('filter-select').value;

  // Always exclude dead Shopify stock (0 or negative qty) from everything on this
  // page, stats included — a row with no eBay side at all (shopify_qty null) is
  // left alone, only an actual 0/-1 hides it.
  const activeInventory = inventory.filter(r => !(r.shopify_product_id && r.shopify_qty != null && r.shopify_qty <= 0));

  let filtered = activeInventory;
  if (search) {
    filtered = filtered.filter(r =>
      (r.title || '').toLowerCase().includes(search) ||
      (r.ebay_sku || '').toLowerCase().includes(search) ||
      (r.shopify_sku || '').toLowerCase().includes(search) ||
      (r.ebay_item_id || '').toLowerCase().includes(search) ||
      (r.shopify_product_id || '').toLowerCase().includes(search));
  }
  if (filter === 'matched') filtered = filtered.filter(r => r.ebay_item_id && r.shopify_product_id);
  if (filter === 'ebay_only') filtered = filtered.filter(r => r.ebay_item_id && !r.shopify_product_id);
  if (filter === 'shopify_only') filtered = filtered.filter(r => r.shopify_product_id && !r.ebay_item_id);
  if (filter === 'qty_variance') filtered = filtered.filter(r => r.qty_variance);
  const shipVal = r => r.ebay_shipping_cost == null ? null : Number(r.ebay_shipping_cost);
  if (filter === 'ship_free') filtered = filtered.filter(r => shipVal(r) === 0);
  if (filter === 'ship_18') filtered = filtered.filter(r => shipVal(r) === 18);
  if (filter === 'ship_69') filtered = filtered.filter(r => shipVal(r) === 69);
  if (filter === 'ship_195') filtered = filtered.filter(r => shipVal(r) === 195);
  if (filter === 'ship_other') filtered = filtered.filter(r => r.ebay_item_id && (shipVal(r) === null || ![0,18,69,195].includes(shipVal(r))));

  document.getElementById('summary-row').style.display = 'grid';
  document.getElementById('stat-total').textContent = activeInventory.length;
  document.getElementById('stat-matched').textContent = activeInventory.filter(r => r.ebay_item_id && r.shopify_product_id).length;
  document.getElementById('stat-ebay-only').textContent = activeInventory.filter(r => r.ebay_item_id && !r.shopify_product_id).length;
  document.getElementById('stat-shopify-only').textContent = activeInventory.filter(r => r.shopify_product_id && !r.ebay_item_id).length;

  if (!filtered.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">No rows match this filter.</div>';
    return;
  }

  if (invSortKey) {
    filtered = [...filtered].sort((a, b) => {
      let av = a[invSortKey], bv = b[invSortKey];
      av = av ?? ''; bv = bv ?? '';
      const cmp = av > bv ? 1 : (av < bv ? -1 : 0);
      return cmp * invSortDir;
    });
  }

  const th = (key, label) => `<th onclick="setInvSort('${key}')" style="cursor:pointer;">${label}${invSortKey===key ? (invSortDir===1?' ▲':' ▼') : ''}</th>`;
  let html = `<table><thead><tr>
    <th></th>${th('title','Title')}${th('ebay_item_id','eBay Item ID')}<th onclick="setInvSort('ebay_sku')" style="cursor:pointer;width:90px;">eBay SKU${invSortKey==='ebay_sku' ? (invSortDir===1?' ▲':' ▼') : ''}</th>${th('ebay_qty','eBay Qty')}${th('ebay_shipping_cost','Ship $')}${th('ebay_created_at','Created')}${th('shopify_product_id','Shopify Product ID')}<th onclick="setInvSort('shopify_sku')" style="cursor:pointer;width:90px;">Shopify SKU${invSortKey==='shopify_sku' ? (invSortDir===1?' ▲':' ▼') : ''}</th>${th('shopify_qty','Shopify Qty')}${th('shopify_price','Shopify Price')}<th>Status</th><th>Matched By</th><th>HD_ID</th><th>Action</th><th>Match</th><th>Hide</th>
  </tr></thead><tbody>`;
  for (const r of filtered) {
    const status = !r.ebay_item_id ? '<span class="missing">Shopify only</span>'
      : !r.shopify_product_id ? '<span class="missing">eBay only</span>'
      : r.qty_variance ? '<span class="warn">Qty mismatch</span>'
      : 'Matched';
    const hdCell = r.hd_id
      ? `<span class="muted" style="font-family:monospace;font-size:11px;" title="${escapeHtml(r.hd_id)}">🔒 ${escapeHtml(r.hd_id.slice(0, 8))}...</span>`
      : '<span class="muted">—</span>';
    // Two ways an item can be published to Shopify from here:
    // 1. A real Lister listing behind it (title/price/photos/description all live
    //    on that listings row) — the original path, unchanged.
    // 2. A genuinely eBay-only item with no Lister listing at all, but with real
    //    photos already downloaded into our own storage via 'Pull eBay-Only Photos'
    //    (ebay_local_photo_ids set) — the new path, using eBay's own title/price/sku
    //    plus those downloaded photos instead of anything from a listings row.
    // Priority: if we've already downloaded real, verified photos for this item
    // ourselves (ebay_local_photo_ids), ALWAYS use those — even when a Lister
    // listing_id also happens to be matched. The old listing_id path relies on
    // listing.photo_id (often blank for these) and then a live eBay-CDN fallback
    // that has been silently failing to attach images at all — that's the actual
    // cause of "published with no photo" even after photos were confirmed
    // downloaded and verified. Our own downloaded copies are the reliable source.
    let actionCell;
    if (!r.shopify_product_id && r.ebay_item_id && r.ebay_local_photo_ids) {
      actionCell = `<button class="btn" style="font-size:11px;padding:4px 8px;" onclick="publishEbayOnlyToShopify(this, '${r.ebay_item_id}')">🛍️ Publish to Shopify (eBay-only)</button>`;
    } else if (!r.shopify_product_id && r.listing_id) {
      actionCell = `<button class="btn" style="font-size:11px;padding:4px 8px;" onclick="publishRowToShopify(this, '${r.listing_id}')">🛍️ Publish to Shopify</button>`;
    } else if (!r.shopify_product_id && !r.listing_id && r.ebay_item_id) {
      actionCell = `<span class="muted" title="Click 'Pull eBay-Only Photos' above first — this item has no photos in our own storage yet.">— (pull photos first)</span>`;
    } else if (r.shopify_product_id && r.ebay_item_id) {
      actionCell = `<button class="btn" style="font-size:11px;padding:4px 8px;color:#f59e0b;border-color:#f59e0b;" data-row-id="${r.id}" data-ebay-id="${escapeHtml(r.ebay_item_id)}" data-title="${escapeHtml(r.title || '')}" onclick="promptPushQuantity(this.dataset.rowId, this.dataset.ebayId, this.dataset.title)" title="Sets a new available quantity on BOTH eBay and Shopify at once, live -- eBay must currently be Active.">📦 Update Qty</button>`;
    } else {
      actionCell = '<span class="muted">—</span>';
    }
    const matchCell = (!r.ebay_item_id || !r.shopify_product_id)
      ? `<button class="btn" style="font-size:11px;padding:4px 8px;" onclick="openManualMatch('${r.id}', ${r.ebay_item_id ? 'true' : 'false'})">🔗 Manual Match</button>`
      : '<span class="muted">—</span>';
    const photoCell = r.ebay_gallery_url
      ? `<img src="${escapeHtml(r.ebay_gallery_url)}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;" loading="lazy" onerror="this.style.display='none'"/>`
      : '';
    const createdCell = r.ebay_created_at ? escapeHtml(String(r.ebay_created_at).slice(0, 10)) : '—';
    html += `<tr>
      <td>${photoCell}</td>
      <td>${escapeHtml(r.title)}</td>
      <td class="muted">${escapeHtml(r.ebay_item_id || '—')}</td>
      <td class="muted sku-col" title="${escapeHtml(r.ebay_sku || '')}">${escapeHtml(r.ebay_sku || '—')}</td>
      <td class="muted">${r.ebay_qty ?? '—'}</td>
      <td class="muted">${r.ebay_shipping_cost != null ? (Number(r.ebay_shipping_cost) === 0 ? 'Free' : '$' + Number(r.ebay_shipping_cost).toFixed(0)) : '—'}</td>
      <td class="muted">${createdCell}</td>
      <td class="muted">${escapeHtml(r.shopify_product_id || '—')}</td>
      <td class="muted sku-col" title="${escapeHtml(r.shopify_sku || '')}">${escapeHtml(r.shopify_sku || '—')}</td>
      <td class="muted">${r.shopify_qty ?? '—'}</td>
      <td class="muted">${r.shopify_price != null ? '$' + Number(r.shopify_price).toFixed(2) : '—'}</td>
      <td>${status}</td>
      <td class="muted">${escapeHtml(r.matched_by || '—')}</td>
      <td>${hdCell}</td>
      <td>${actionCell}</td>
      <td>${matchCell}</td>
      <td><button class="btn" style="font-size:11px;padding:4px 8px;color:var(--red,#ef4444);" onclick="hideInventoryRow(this, '${r.id}', '${escapeHtml(r.title).replace(/'/g, "\\'")}')" title="Permanently removes this row from the list. Undo any time from the Unhide panel at the top.">🙈 Hide</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('table-area').innerHTML = html;
}

async function publishRowToShopify(btn, listingId) {
  if (!confirm('Publish this item to Shopify now, using its saved title/price/photos from Lister?')) return;
  btn.disabled = true;
  btn.textContent = 'Publishing...';
  try {
    const r = await fetch(`/api/listings/${listingId}/shopify-publish`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('Published to Shopify ✓');
    loadInventory();  // lightweight local reload -- the publish endpoint already wrote
                       // the new Shopify product into local tables directly, no need
                       // for a full eBay+Shopify catalog re-sync just to reflect this
  } catch(e) {
    alert(`Failed to publish: ${e.message}`);
    btn.disabled = false;
    btn.textContent = '🛍️ Publish to Shopify';
  }
}

async function publishEbayOnlyToShopify(btn, rowId) {
  if (!confirm("Publish this eBay-only item to Shopify now, using eBay's own title/price/SKU and the photos already downloaded into our own storage?")) return;
  btn.disabled = true;
  btn.textContent = 'Publishing...';
  try {
    const r = await fetch(`/api/inventory/${rowId}/publish-ebay-only-to-shopify`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('Published to Shopify ✓');
    loadInventory();  // same reasoning as the other publish path above
  } catch(e) {
    alert(`Failed to publish: ${e.message}`);
    btn.disabled = false;
    btn.textContent = '🛍️ Publish to Shopify (eBay-only)';
  }
}

async function hideNoCreatedDate() {
  if (!confirm('Hide every eBay-only row with no Created date? This is permanent (undo any time from the Hidden Items panel).')) return;
  try {
    const r = await fetch('/api/inventory/hide-no-created-date', {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast(`Hid ${data.hidden_count} item(s) ✓`);
    loadInventory();
    loadHiddenInventory();
  } catch(e) {
    alert(`Failed: ${e.message}`);
  }
}

async function hideInventoryRow(btn, rowId, title) {
  if (!confirm(`Hide "${title}" from this list? It won't show up here again unless you unhide it from the panel at the top.`)) return;
  btn.disabled = true;
  try {
    const r = await fetch(`/api/inventory/${rowId}/hide`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('Hidden ✓');
    loadInventory();
    loadHiddenInventory();
  } catch(e) {
    alert(`Failed to hide: ${e.message}`);
    btn.disabled = false;
  }
}

async function unhideInventoryRow(btn, rowId) {
  btn.disabled = true;
  btn.textContent = 'Unhiding...';
  try {
    const r = await fetch(`/api/inventory/${rowId}/unhide`, {method: 'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('Unhidden ✓');
    loadInventory();
    loadHiddenInventory();
  } catch(e) {
    alert(`Failed to unhide: ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Unhide';
  }
}

async function loadHiddenInventory() {
  try {
    const r = await fetch('/api/inventory/hidden');
    const data = await r.json();
    const hidden = data.hidden || [];
    const area = document.getElementById('hidden-inventory-area');
    const toggleBtn = document.getElementById('hidden-inventory-toggle');
    toggleBtn.textContent = `🙈 Hidden Items (${hidden.length})`;
    if (!hidden.length) {
      area.innerHTML = '<div class="empty">No hidden items.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Title</th><th>HD_ID</th><th></th></tr></thead><tbody>';
    for (const h of hidden) {
      html += `<tr>
        <td>${escapeHtml(h.title || '')}</td>
        <td class="muted">${escapeHtml(h.hd_id || '—')}</td>
        <td><button class="btn" style="font-size:11px;padding:4px 8px;" onclick="unhideInventoryRow(this, '${h.id}')">Unhide</button></td>
      </tr>`;
    }
    html += '</tbody></table>';
    area.innerHTML = html;
  } catch(e) {
    console.error('Failed to load hidden inventory', e);
  }
}

function toggleHiddenInventoryPanel() {
  const area = document.getElementById('hidden-inventory-area');
  const isOpen = area.style.display !== 'none';
  area.style.display = isOpen ? 'none' : '';
  if (!isOpen) loadHiddenInventory();
}

let mmSourceRowId = null;
let mmSourceIsEbay = false;

function openManualMatch(rowId, isEbay) {
  mmSourceRowId = rowId;
  mmSourceIsEbay = isEbay;
  const src = inventory.find(r => r.id === rowId);
  document.getElementById('mm-source-title').textContent =
    `Matching: "${src ? src.title : ''}" — pick its real counterpart on ${isEbay ? 'Shopify' : 'eBay'} below.`;
  document.getElementById('mm-search-input').value = '';
  document.getElementById('mm-overlay').classList.add('open');
  renderMmCandidates();
}

function closeManualMatch(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('mm-overlay').classList.remove('open');
}

function renderMmCandidates() {
  const q = document.getElementById('mm-search-input').value.trim().toLowerCase();
  // Candidates are rows on the OPPOSITE side that are either genuinely
  // unmatched, OR (when searching from an eBay-only row) matched to an eBay
  // listing that's since ended -- the end-and-relist scenario, where the
  // Shopify side's real pairing needs to move to the new listing instead.
  // A Shopify item still matched to a genuinely ACTIVE eBay listing is never
  // shown here -- reassigning that would silently orphan a live listing.
  const candidates = inventory.filter(r => {
    if (mmSourceIsEbay) {
      if (!r.shopify_product_id) return false;
      const isUnmatched = !r.ebay_item_id;
      const isReassignable = r.ebay_item_id && r.ebay_still_active === false;
      if (!isUnmatched && !isReassignable) return false;
    } else {
      if (!(r.ebay_item_id && !r.shopify_product_id)) return false;
    }
    if (q && !(r.title || '').toLowerCase().includes(q)) return false;
    return true;
  }).slice(0, 50);
  const area = document.getElementById('mm-candidates');
  if (!candidates.length) {
    area.innerHTML = '<div class="empty">No matching candidates found — try a different search term.</div>';
    return;
  }
  area.innerHTML = candidates.map(c => {
    const isReassign = mmSourceIsEbay && c.ebay_item_id && c.ebay_still_active === false;
    return `
    <div class="mm-candidate" onclick="confirmManualMatch('${c.id}')">
      <div style="font-weight:600;">${escapeHtml(c.title || '')}</div>
      <div class="muted" style="font-size:11px;">${mmSourceIsEbay ? 'Shopify Product ID' : 'eBay Item ID'}: ${escapeHtml(mmSourceIsEbay ? (c.shopify_product_id || '') : (c.ebay_item_id || ''))}</div>
      ${isReassign ? `<div style="font-size:11px;color:#f0ad4e;margin-top:2px;">⚠️ Currently linked to ended eBay listing ${escapeHtml(c.ebay_item_id)} — that link will be removed and replaced with this one</div>` : ''}
    </div>
  `;
  }).join('');
}

async function confirmManualMatch(candidateRowId) {
  if (!confirm('Link these two as the same item permanently?')) return;
  const body = mmSourceIsEbay
    ? {ebay_row_id: mmSourceRowId, shopify_row_id: candidateRowId}
    : {ebay_row_id: candidateRowId, shopify_row_id: mmSourceRowId};
  try {
    const r = await fetch('/api/inventory/manual-match', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('Manually matched and locked in ✓');
    closeManualMatch();
    loadInventory();
  } catch(e) {
    alert(`Failed to match: ${e.message}`);
  }
}

async function promptPushQuantity(rowId, ebayItemId, title) {
  const input = prompt(`New AVAILABLE quantity for:\n${title}\n\nThis writes live to BOTH eBay (item ${ebayItemId}) and Shopify right now. eBay must currently be Active.`);
  if (input === null) return;
  const qty = parseInt(input, 10);
  if (isNaN(qty) || qty < 0) { alert('Enter a whole number, 0 or greater.'); return; }
  if (!confirm(`Confirm: set available quantity to ${qty} on BOTH eBay and Shopify now? This can't be undone with a button click — you'd need to push another update to change it back.`)) return;
  try {
    const r = await fetch(`/api/inventory/${rowId}/push-quantity`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({quantity: qty}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast(`Quantity set to ${qty} on both platforms ✓`);
    loadInventory();
  } catch(e) {
    alert(`Quantity push failed: ${e.message}`);
  }
}

loadInventory();
loadHiddenInventory();
</script>
