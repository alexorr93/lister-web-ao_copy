<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ready — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root {
  --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #2563eb; --green: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; font-family: inherit; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.nav-account { font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.nav-intake     { color: #3b82f6; }
.nav-upload     { color: #22b8d8; }
.nav-fastscan   { color: #22c55e; }
.nav-archive    { color: #ef4444; }
.nav-inventory  { color: #a78bfa; }
.nav-financials { color: #eab308; }
.nav-analytics  { color: #06b6d4; }
.nav-lots       { color: #fb923c; }
.nav-shopify    { color: #95bf47; }
.nav-categories { color: #14b8a6; }
.nav-auction    { color: #f59e0b; }
.nav-settings   { color: #94a3b8; }
.nav-intake.active     { background: #2563eb; color: #fff; }
.nav-upload.active     { background: #0891b2; color: #fff; }
.nav-fastscan.active   { background: #16a34a; color: #fff; }
.nav-archive.active    { background: #dc2626; color: #fff; }
.nav-inventory.active  { background: #7c3aed; color: #fff; }
.nav-financials.active { background: #ca8a04; color: #fff; }
.nav-analytics.active  { background: #0891b2; color: #fff; }
.nav-lots.active       { background: #ea580c; color: #fff; }
.nav-shopify.active    { background: #95bf47; color: #fff; }
.nav-categories.active { background: #0d9488; color: #fff; }
.nav-auction.active    { background: #f59e0b; color: #1a0611; }
.nav-settings.active   { background: #475569; color: #fff; }
.main { max-width: 1700px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.action-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--border); }
.btn-green { background: var(--green); border-color: var(--green); color: #fff; }
.btn-green:hover { background: #15803d; }
.spacer { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
.card.selected { border-color: var(--green); background: rgba(22,163,74,0.15); box-shadow: 0 0 0 2px rgba(22,163,74,0.3); }
.photo { position: relative; width: 100%; padding-top: 90%; background: #161925; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.photo-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #3d4663; }
.body { padding: 10px 12px; }
.title { font-size: 13px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.price { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.date { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.controls { padding: 0 12px 12px; display: flex; gap: 8px; align-items: center; }
.check { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
.check.checked { background: var(--green); border-color: var(--green); }
.check.checked::after { content: '✓'; color: #fff; font-size: 14px; font-weight: 900; }
.restore-btn { flex: 1; padding: 6px 10px; background: var(--green); border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
.restore-btn:hover { background: #15803d; }
.empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 10px; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--green); border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; transform: translateY(100px); transition: transform 0.2s; z-index: 100; }
.toast.show { transform: translateY(0); }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="main">
  <h1>✅ Ready</h1>
  <p class="sub">Items you've fully prepped and set aside for later — cleared out of the main Intake queue. Send any of them (or all) back to the queue whenever you're ready to publish.</p>
  <div class="action-bar">
    <button class="btn" onclick="selectAll()">☑ Select All</button>
    <button class="btn" onclick="deselectAll()">☐ Deselect</button>
    <span id="count-label" style="color:var(--muted);font-size:13px;"></span>
    <div class="spacer"></div>
    <button class="btn btn-green" id="restore-selected-btn" style="display:none;" onclick="restoreSelected()">↩️ Send to Queue (Selected)</button>
    <button class="btn btn-green" onclick="restoreAll()">↩️ Send All to Queue</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="empty-icon">✅</div>
    <div>Ready folder is empty — nothing here yet.</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let items = [];
let selected = new Set();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadArchive() {
  try {
    const r = await fetch('/api/listings?ready=true');
    items = await r.json();
    render();
  } catch(e) {
    toast('Failed to load ready folder: ' + e.message);
  }
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}

function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!items.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('count-label').textContent = '';
    document.getElementById('restore-selected-btn').style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  document.getElementById('count-label').textContent = items.length + ' archived item' + (items.length === 1 ? '' : 's');

  grid.innerHTML = items.map(l => {
    const isSel = selected.has(String(l.id));
    const photoHtml = l.thumb_url
      ? `<img src="${l.thumb_url}" alt="" loading="lazy"/>`
      : `<div class="photo-placeholder">📷</div>`;
    return `<div class="card${isSel ? ' selected' : ''}" id="card-${l.id}">
      <div class="photo">${photoHtml}</div>
      <div class="body">
        <div class="title">${(l.title||'Untitled').slice(0,80)}</div>
        <div class="price">$${(l.price||0).toFixed(2)}</div>
        <div class="date">Ready — originally added ${formatDate(l.created_at)}</div>
        ${l.ebay_item_id ? `
        <div style="display:flex;gap:6px;margin-top:8px;">
          <input type="text" class="sku-edit-input" data-item-id="${l.id}" value="${(l.ebay_sku||'').replace(/"/g,'&quot;')}" placeholder="SKU" style="flex:1;min-width:0;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:#161925;color:var(--text);font-size:12px;" autocomplete="off" data-lpignore="true" data-1p-ignore="true" name="archive-sku-${l.id}"/>
          <button class="btn" style="font-size:11px;padding:6px 10px;" onclick="saveArchivedSku('${l.id}')">Save</button>
        </div>` : ''}
      </div>
      <div class="controls">
        <div class="check${isSel?' checked':''}" onclick="toggleSelect('${l.id}')"></div>
        <button class="restore-btn" onclick="restoreOne('${l.id}')">↩️ Send to Queue</button>
      </div>
    </div>`;
  }).join('');
}

function toggleSelect(id) {
  id = String(id);
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  document.getElementById('restore-selected-btn').style.display = selected.size ? 'inline-block' : 'none';
  render();
}
function selectAll() { items.forEach(l => selected.add(String(l.id))); render(); document.getElementById('restore-selected-btn').style.display = 'inline-block'; }
function deselectAll() { selected.clear(); render(); document.getElementById('restore-selected-btn').style.display = 'none'; }

async function restoreOne(id) {
  try {
    await fetch('/api/listings/restore', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids:[id], from_status:'ready'})});
    items = items.filter(l => String(l.id) !== String(id));
    selected.delete(String(id));
    render();
    toast('Sent to queue ✓ — back on your Intake dashboard');
  } catch(e) { toast('Failed to send to queue: ' + e.message); }
}

async function restoreSelected() {
  if (!selected.size) return;
  const ids = Array.from(selected);
  try {
    await fetch('/api/listings/restore', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids, from_status:'ready'})});
    items = items.filter(l => !selected.has(String(l.id)));
    selected.clear();
    render();
    toast(`Sent ${ids.length} item(s) to queue ✓`);
  } catch(e) { toast('Failed to send to queue: ' + e.message); }
}

async function restoreAll() {
  if (!items.length) return;
  if (!confirm(`Send all ${items.length} ready items back to the Intake queue?`)) return;
  try {
    await fetch('/api/listings/restore', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({from_status:'ready'})});
    items = [];
    selected.clear();
    render();
    toast('All items sent to queue ✓');
  } catch(e) { toast('Failed to send to queue: ' + e.message); }
}

async function saveArchivedSku(id) {
  // Published items get archived (normal cleanup) and previously had NO way to
  // fix their SKU afterward short of Restore -> edit in Intake -> re-archive.
  // Same endpoint the Intake modal and Lots page already use for this.
  const input = document.querySelector(`.sku-edit-input[data-item-id="${id}"]`);
  const newSku = input.value.trim();
  if (!newSku) { toast('SKU cannot be blank'); return; }
  try {
    const r = await fetch(`/api/listings/${id}/ebay-v2/sku`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({new_sku: newSku}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    toast('SKU updated ✓');
  } catch(e) { toast('SKU update failed: ' + e.message); }
}

loadArchive();
</script>
</body>
</html>
