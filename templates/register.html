<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — RoboSeller</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #050608;
  color: #f0f4f8;
  font-family: 'Instrument Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
.shell { max-width: 420px; width: 100%; position: relative; z-index: 1; }

.logo {
  display: flex; align-items: center; gap: 10px;
  justify-content: center;
  margin-bottom: 32px;
  text-decoration: none;
}
.logo-text { font-family: 'Instrument Sans', sans-serif; font-size: 22px; font-weight: 800; }
.logo-text .green { color: #4ade80; }
.logo-text .white { color: #fff; }

.card {
  background: #0d1018;
  border: 1px solid #1a2030;
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 0 60px rgba(74,222,128,0.05);
}

.card-header { margin-bottom: 28px; }
.card-title { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.card-sub { font-size: 14px; color: #64748b; line-height: 1.5; }

.free-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
  border-radius: 100px; padding: 5px 14px;
  font-family: 'DM Mono', monospace; font-size: 11px; color: #4ade80;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 16px;
}
.free-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 6px #4ade80;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.error-box {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: 10px; padding: 12px 14px;
  color: #f87171; font-size: 13px;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.error-box::before { content: '⚠'; flex-shrink: 0; }

.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 700;
  color: #64748b; text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 7px; font-family: 'DM Mono', monospace;
}
.field input {
  width: 100%;
  background: #080b10;
  border: 1px solid #1a2030;
  border-radius: 10px;
  padding: 12px 14px;
  color: #f0f4f8;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  border-color: rgba(74,222,128,0.4);
  box-shadow: 0 0 0 3px rgba(74,222,128,0.06);
}
.field input::placeholder { color: #2a3548; }

.btn-submit {
  width: 100%;
  background: #4ade80;
  color: #000;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  padding: 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover { background: #86efac; }
.btn-submit:active { transform: scale(0.98); }

.divider { text-align: center; margin: 20px 0; }
.divider span { font-size: 12px; color: #2a3548; font-family: 'DM Mono', monospace; }

.perks { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.perk { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; }
.perk-check { width: 16px; height: 16px; border-radius: 50%; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; color: #4ade80; }

.signin-link {
  text-align: center; margin-top: 24px;
  font-size: 13px; color: #64748b;
}
.signin-link a { color: #4ade80; text-decoration: none; font-weight: 600; }
.signin-link a:hover { text-decoration: underline; }

.back-link {
  text-align: center; margin-bottom: 20px;
}
.back-link a {
  font-size: 13px; color: #4a5568; text-decoration: none;
  font-family: 'DM Mono', monospace;
  transition: color 0.2s;
}
.back-link a:hover { color: #4ade80; }
</style>
</head>
<body>
<div class="shell">

  <a href="/landing" class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="2" x2="12" y2="5"/><circle cx="12" cy="2" r="1" fill="#4ade80" stroke="none"/>
      <rect x="5" y="6" width="14" height="12" rx="2"/>
      <circle cx="9" cy="11" r="1.4" fill="#4ade80" stroke="none"/>
      <circle cx="15" cy="11" r="1.4" fill="#4ade80" stroke="none"/>
      <line x1="3" y1="11" x2="5" y2="11"/><line x1="19" y1="11" x2="21" y2="11"/>
    </svg>
    <div class="logo-text"><span class="green">Robo</span><span class="white">Seller</span></div>
  </a>

  <div class="card">
    <div class="free-badge">100 free scans — no card needed</div>

    <div class="card-header">
      <div class="card-title">Create your account</div>
      <div class="card-sub">Start reselling smarter. It takes 30 seconds.</div>
    </div>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="POST" action="/register">
      <div class="field">
        <label>Business / Store Name</label>
        <input type="text" name="business_name" required autofocus placeholder="e.g. Jake's Finds" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" id="email-input" required placeholder="you@email.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required minlength="8" placeholder="8+ characters" />
      </div>
      <button type="submit" class="btn-submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Create free account
      </button>
    </form>

    <div class="perks">
      <div class="perk"><div class="perk-check">✓</div>100 free AI scans included</div>
      <div class="perk"><div class="perk-check">✓</div>No credit card required</div>
      <div class="perk"><div class="perk-check">✓</div>All features unlocked from day one</div>
    </div>
  </div>

  <div class="signin-link">Already have an account? <a href="/login">Sign in →</a></div>
</div>

<script>
// Pre-fill email from landing page CTA
(function() {
  var params = new URLSearchParams(window.location.search);
  var email = params.get('email');
  if (email) {
    var el = document.getElementById('email-input');
    if (el) el.value = email;
  }
})();
</script>
</body>
</html>
