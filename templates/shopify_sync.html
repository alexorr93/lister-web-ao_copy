<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shopify Sync — Lister AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root { --bg: #1a0611; --card: #1e2535; --border: #2d3348; --text: #f1f5f9; --muted: #64748b; --accent: #16a34a; --green: #16a34a; --red: #dc2626; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-logo { font-weight: 800; font-size: 15px; color: var(--text); margin-right: 8px; white-space: nowrap; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: transparent; color: var(--muted); transition: all 0.15s; text-decoration: none; display: inline-block; }
.nav-btn:hover { background: #1e2535; color: var(--text); }
.nav-btn.active { color: #fff; background: var(--accent); }
.nav-spacer { flex: 1; }
.nav-download { padding: 6px 12px; background: #1e2535; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; }
.main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.filter-bar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.field-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
.field-input { background: #fff; color: #111; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.quick-range { display: flex; gap: 6px; }
.quick-range button { padding: 8px 10px; font-size: 12px; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: #1e2535; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
.muted { color: var(--muted); }
.yes { color: var(--green); font-weight: 700; }
.no { color: var(--red); font-weight: 700; }
.status-msg { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
tr.synced td { background: rgba(22, 163, 74, 0.16); }
.synced-badge { color: var(--green); font-weight: 700; }
.push-again { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">📦 Lister AI</div>
  <a class="nav-btn" href="/">📊 Dashboard</a>
  <a class="nav-btn" href="/financials">💰 Financials</a>
  <a class="nav-btn" href="/acquisitions">🛒 Lots</a>
  <a class="nav-btn" href="/inventory">📦 Inventory</a>
  <a class="nav-btn active" href="/shopify-sync">🔁 Shopify Sync</a>
  <div class="nav-spacer"></div>
  <a class="nav-download" href="/logout" style="color:#ef4444;border-color:#7f1d1d;">⏻ Logout</a>
</nav>

<div class="main">
  <h1>Shopify Sync</h1>
  <div class="sub">Everything sold on eBay in the selected range, checked live against both platforms. Read-only — nothing gets changed until you push.</div>

  <div class="filter-bar">
    <div>
      <div class="field-label">Start Date</div>
      <input type="date" class="field-input" id="start-date"/>
    </div>
    <div>
      <div class="field-label">End Date</div>
      <input type="date" class="field-input" id="end-date"/>
    </div>
    <button class="btn btn-primary" onclick="loadToday()">🔄 Apply</button>
    <div class="quick-range">
      <button class="btn" onclick="setToday()">Today</button>
      <button class="btn" onclick="setRange(7)">Last 7d</button>
      <button class="btn" onclick="setRange(30)">Last 30d</button>
      <button class="btn" onclick="setThisMonth()">This Month</button>
      <button class="btn" onclick="setLastMonth()">Last Month</button>
    </div>
  </div>

  <div id="status" class="status-msg"></div>

  <div id="table-area"><div class="empty">Loading today's sales…</div></div>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let currentItems = [];

function setToday() {
  const now = new Date();
  const d = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  document.getElementById('start-date').value = d;
  document.getElementById('end-date').value = d;
  loadToday();
}

function setRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(start.getDate() - days);
  document.getElementById('end-date').value = end.toISOString().slice(0,10);
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  loadToday();
}

function setThisMonth() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  document.getElementById('end-date').value = now.toISOString().slice(0,10);
  loadToday();
}

function setLastMonth() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const end = new Date(now.getFullYear(), now.getMonth(), 0);
  document.getElementById('start-date').value = start.toISOString().slice(0,10);
  document.getElementById('end-date').value = end.toISOString().slice(0,10);
  loadToday();
}

async function loadToday() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  document.getElementById('status').textContent = 'Checking live quantities on both platforms...';
  document.getElementById('table-area').innerHTML = '';
  try {
    const r = await fetch('/api/shopify-sync/today?start=' + start + '&end=' + end);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    const rangeLabel = data.start_date === data.end_date ? data.start_date : `${data.start_date} – ${data.end_date}`;
    document.getElementById('status').textContent = `${rangeLabel} — ${data.items.length} distinct SKU(s) sold on eBay.`;
    currentItems = data.items;
    renderTable(currentItems);
  } catch(e) {
    document.getElementById('status').textContent = `❌ ${e.message}`;
  }
}

async function pushOne(idx) {
  const it = currentItems[idx];
  if (!confirm(`Decrease Shopify quantity for "${it.title}" by ${it.qty_sold_today}? This changes your live Shopify listing.`)) return;
  const cell = document.getElementById('push-cell-' + idx);
  const row = document.getElementById('row-' + idx);
  cell.textContent = 'Pushing...';
  try {
    const r = await fetch('/api/shopify-sync/push', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify([it]),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    const res = data.results[0];
    if (res.status === 'success') {
      it.already_pushed = true;
      it.shopify_live_qty = res.new_quantity;
      it.qty_matches = true;
      row.classList.add('synced');
      cell.innerHTML = `<span class="synced-badge">✔ Pushed — now ${res.new_quantity}</span><button class="push-again" onclick="pushOne(${idx})">push again</button>`;
    } else {
      cell.innerHTML = `<span class="no">✘ ${res.error || res.status}</span>`;
    }
  } catch(e) {
    cell.innerHTML = `<span class="no">✘ ${e.message}</span>`;
  }
}

function renderTable(items) {
  if (!items.length) {
    document.getElementById('table-area').innerHTML = '<div class="empty">Nothing sold on eBay in this range (with a real SKU) yet.</div>';
    return;
  }
  let html = `<table><thead><tr>
    <th>SKU</th><th>eBay Item</th><th>Qty Sold (eBay)</th><th>eBay Live Qty</th><th>Found in Shopify?</th><th>Shopify Live Qty</th><th>Shopify Title</th><th>Push</th>
  </tr></thead><tbody>`;
  items.forEach((it, idx) => {
    const synced = !!it.already_pushed && !!it.qty_matches;
    const pushCell = it.shopify_found
      ? (synced
          ? `<span class="synced-badge">✔ Already Pushed</span><button class="push-again" onclick="pushOne(${idx})">push again</button>`
          : `<button class="btn btn-primary" style="padding:6px 12px;font-size:12px;margin:0;" onclick="pushOne(${idx})">Push -${it.qty_sold_today}</button>`)
      : '—';
    html += `<tr id="row-${idx}" class="${synced ? 'synced' : ''}">
      <td class="muted">${escapeHtml(it.sku)}</td>
      <td>${escapeHtml(it.title || '')}</td>
      <td>${it.qty_sold_today}</td>
      <td>${it.ebay_live_qty ?? '—'}</td>
      <td class="${it.shopify_found ? 'yes' : 'no'}">${it.shopify_found ? '✔ Yes' : '✘ No'}</td>
      <td>${it.shopify_live_qty ?? '—'}</td>
      <td class="muted">${escapeHtml(it.shopify_title || '')}</td>
      <td id="push-cell-${idx}">${pushCell}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('table-area').innerHTML = html;
}

setToday();
</script>
</body>
</html>
